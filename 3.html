<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INDEX - 唐择镇</title>
    <style>
        :root {
            --paper-white: #f5f5f7;
            --accent-red: #ff3b30;
            --text-dim: #86868b;
            --black: #1d1d1f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #0a0b10;
            color: var(--black);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            height: 100svh;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            perspective: 2000px;
        }

        .particles { position: fixed; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .dot { position: absolute; background: white; border-radius: 50%; opacity: 0.2; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: translateZ(var(--z)) scale(0.8); }
            50% { opacity: 0.6; transform: translateZ(var(--z)) scale(1.2); }
        }

        .poster-frame {
            position: relative;
            z-index: 10;
            background: var(--paper-white);
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1);
            width: 90%;
            max-width: 450px;
            height: 85vh;
            max-height: 750px;
            padding: clamp(20px, 6vw, 35px);
        }

        @media (min-width: 1024px) {
            .poster-frame {
                max-width: 400px;
                height: 80vh;
            }
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .back-link { font-size: 10px; font-weight: 800; color: var(--accent-red); text-decoration: none; border-bottom: 1px solid var(--accent-red); }

        .title-area { flex-shrink: 0; margin-bottom: 15px; }
        .section-title { font-size: clamp(20px, 6vw, 26px); font-weight: 900; letter-spacing: 2px; }
        .section-sub { font-size: 10px; color: var(--text-dim); text-transform: uppercase; }

        .list-container {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 8px;
            margin-right: -8px;
        }

        .list-container::-webkit-scrollbar { width: 3px; }
        .list-container::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 10px; }

        .list-item {
            display: block; text-decoration: none; color: inherit;
            padding: 15px 0; border-bottom: 1px solid #e5e5e5;
            transition: all 0.3s ease;
        }

        .item-meta { font-family: monospace; font-size: 10px; color: var(--accent-red); margin-bottom: 6px; display: flex; justify-content: space-between; }
        .item-title {
            font-size: clamp(14px, 4vw, 15px);
            font-weight: 700;
            line-height: 1.4;
            transition: 0.3s;
        }

        @media (hover: hover) {
            .list-item:hover .item-title { color: var(--accent-red); transform: translateX(8px); }
        }

        .footer {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            border-top: 1px solid #eee;
            padding-top: 15px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="poster-frame" id="poster">
        <div class="header">
            <a href="javascript:history.back()" class="back-link">← RETURN</a>
            <div id="time-code" style="font-family: monospace; font-size: 10px;">00:00:00</div>
        </div>

        <div class="title-area">
            <div class="section-title">DIRECTORY</div>
            <div class="section-sub">Archive / Theory Node 2.0</div>
        </div>

        <div class="list-container">
            <a href="portfolio.html" class="list-item">
                <div class="item-meta"><span>INDEX_00</span><span>2026/05/07</span></div>
                <div class="item-title">作品集</div>
            </a>
            <a href="zhangwairen-script.html" class="list-item">
                <div class="item-meta"><span>INDEX_01</span><span>2024/05/12</span></div>
                <div class="item-title">电视剧策划书 账外人</div>
            </a>
            <a href="https://movieratingsystem.streamlit.app" class="list-item">
                <div class="item-meta"><span>INDEX_02</span><span>2024/06/20</span></div>
                <div class="item-title">电影分级检索器</div>
            </a>
            <a href="ta-zuoshi.html" class="list-item">
                <div class="item-meta"><span>INDEX_03</span><span>2024/08/01</span></div>
                <div class="item-title">"她"组诗</div>
            </a>
            <a href="milian-diary.html" class="list-item">
                <div class="item-meta"><span>INDEX_04</span><span>2024/09/15</span></div>
                <div class="item-title">迷恋日记</div>
            </a>
            <a href="post-editor.html" class="list-item">
                <div class="item-meta"><span>INDEX_05</span><span>2024/10/05</span></div>
                <div class="item-title">博客文章模版</div>
            </a>
        </div>

        <div class="footer">
            <div>CATALOG ACCESS GRANTED</div>
            <div style="color: var(--accent-red)">ID: TZ-2026</div>
        </div>
    </div>

    <script>
        const poster = document.getElementById('poster');
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;

        if (window.matchMedia("(pointer: fine)").matches) {
            window.addEventListener('mousemove', (e) => {
                targetX = (e.clientX / window.innerWidth - 0.5) * 20;
                targetY = (e.clientY / window.innerHeight - 0.5) * 20;
            });
        }

        function updateParallax() {
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;
            poster.style.transform = `rotateY(${currentX}deg) rotateX(${-currentY}deg)`;
            requestAnimationFrame(updateParallax);
        }
        updateParallax();

        setInterval(() => {
            const now = new Date();
            document.getElementById('time-code').textContent = now.toLocaleTimeString('en-GB', { hour12: false });
        }, 1000);

        const partContainer = document.getElementById('particles');
        const particleCount = window.innerWidth < 768 ? 30 : 60;

        for(let i=0; i<particleCount; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            const size = Math.random() * 2;
            dot.style.cssText = `
                width:${size}px;
                height:${size}px;
                left:${Math.random()*100}%;
                top:${Math.random()*100}%;
                --z:${Math.random()*1000-500}px;
                --duration:${2+Math.random()*3}s;
            `;
            partContainer.appendChild(dot);
        }
    </script>
</body>
</html>
