<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="从照片的明暗边缘中提取线条，生成缓慢流动的平面星云。">
<title>余像 · 照片星云</title>
<link rel="stylesheet" href="assets/photo-nebula.css">
<script src="assets/photo-nebula.js" defer></script>
</head>
<body>
<header class="top"><a href="index.html">唐择镇 <span>/ 感知漫游</span></a><span class="edition">IMAGE STUDY — 02</span></header>
<main>
<section class="intro"><div><p class="eyebrow">光的轮廓 / AFTERIMAGE</p><h1>余像<span>把照片，留成星云。</span></h1></div><p class="description">明暗成为线索，轮廓成为星尘。<br>照片在浏览器内处理，画面只呈现提取后的线与光点。</p></section>
<section class="workspace" aria-label="照片星云工作台">
<div class="stage" id="stage"><canvas id="nebula" tabindex="0" aria-label="由照片边缘生成的平面星云。方向键平移，加减号缩放，Home 归位。"></canvas><div class="stage-label"><span id="source-label">初始习作 · 等高线</span><span>FLAT FIELD / 01</span></div><div class="stage-foot"><span id="point-count">正在生成线场</span><span>拖动平移 · 滚轮或双指缩放</span></div><div id="drop-hint">放下照片，生成新的星云</div></div>
<aside class="controls"><div class="control-heading"><span>01 / 输入</span><button id="demo" class="text-button" type="button">回到习作 ↗</button></div><label class="upload" for="photo"><span class="upload-icon">＋</span><strong>选择一张照片</strong><span>也可拖入左侧画面 · JPG / PNG / WebP</span><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="status" id="status" role="status" aria-live="polite">试试人像、树枝或建筑，让清晰的明暗边界成为线条。</p>
<div class="control-heading settings-title"><span>02 / 成像</span><button id="reset" class="text-button" type="button">复位</button></div>
<label class="setting" for="detail"><span>轮廓细节 <output id="detail-value">55</output></span><input id="detail" type="range" min="0" max="100" value="55"><small>从主要边界，到细微纹理</small></label>
<label class="setting" for="diffusion"><span>星尘弥散 <output id="diffusion-value">35</output></span><input id="diffusion" type="range" min="0" max="100" value="35"></label>
<label class="setting" for="light"><span>光的强度 <output id="light-value">60</output></span><input id="light" type="range" min="10" max="100" value="60"></label>
<fieldset class="colors"><legend>光谱</legend><label><input type="radio" name="color" value="ice" checked><span class="swatch ice"></span>冰蓝</label><label><input type="radio" name="color" value="amber"><span class="swatch amber"></span>琥珀</label><label><input type="radio" name="color" value="silver"><span class="swatch silver"></span>银白</label></fieldset>
<div class="actions"><button id="pause" type="button" aria-pressed="false">暂停流动</button><button id="export" type="button">保存 PNG ↗</button></div><button id="fit" class="text-button fit" type="button">画面归位</button>
<p class="note">照片不上传服务器，也不作为底图显示。线条来自亮度梯度；低对比度照片可提高“轮廓细节”。</p></aside>
</section>
<footer><span>AFTERIMAGE — 线与光的练习</span><a href="ta.html">观看「她」的粒子轨迹 ↗</a></footer>
</main>
</body></html>
