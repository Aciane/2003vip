<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>唐择镇的博客</title>
    <style>
        :root {
            --paper-white: #f5f5f7;
            --paper-gray: #e5e5e7;
            --accent-black: #1d1d1f;
            --accent-red: #ff3b30;
            --text-dim: #86868b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--paper-white);
            color: var(--accent-black);
            font-family: -apple-system, "SF Pro SC", "PingFang SC", system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, #d1d1d6 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.3;
            z-index: -1;
        }

        .scene {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* 背景装饰：在手机上调小字号 */
        .layer-back {
            position: absolute;
            font-size: 15vw;
            font-weight: 900;
            color: var(--paper-gray);
            transform: translate3d(0, 0, -150px);
            user-select: none;
            white-space: nowrap;
            z-index: 1;
        }

        /* 核心卡片容器：响应式关键 */
        .poster-frame {
            position: relative;
            width: 90%;
            max-width: 400px; /* PC端最大宽度 */
            aspect-ratio: 3 / 4; /* 保持海报比例 */
            background: white;
            box-shadow: 0 30px 60px rgba(0,0,0,0.12);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            transform: translate3d(0, 0, 0);
        }

        .poster-image {
            flex-grow: 1;
            margin: 20px 0;
            background: #1c1c1e;
            position: relative;
            overflow: hidden;
            border-radius: 1px;
        }

        .poster-image::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.05) 45%, transparent 50%);
            animation: light-sweep 4s infinite;
        }

        @keyframes light-sweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 标签：手机端自动调整 */
        .layer-front {
            position: absolute;
            z-index: 20;
            transform: translate3d(0, 0, 40px);
            pointer-events: none;
        }

        .tag {
            background: var(--accent-black);
            color: white;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .title-group h1 { font-size: 20px; font-weight: 800; }
        .title-group p { font-size: 9px; color: var(--text-dim); margin-top: 4px; }
        .time-code { font-family: monospace; font-size: 12px; color: var(--accent-red); }

        .footer-info { border-top: 1px solid #eee; padding-top: 15px; }
        .meta-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 10px; }
        .meta-label { color: var(--text-dim); }

        /* 响应式微调 */
        @media (max-height: 700px) {
            .poster-frame { padding: 20px; }
            .poster-image { margin: 10px 0; }
        }

        /* 中间黑色方块的悬停菜单 */
        .poster-image .menu-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; width: 140px; height: 140px; pointer-events: auto; }

        .menu-trigger { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .18s ease, background .18s ease; }
        .menu-trigger span { display: block; width: 28px; height: 2px; background: white; position: relative; }
        .menu-trigger span::before, .menu-trigger span::after { content: ''; position: absolute; left: 0; right: 0; height: 2px; background: white; }
        .menu-trigger span::before { top: -8px; }
        .menu-trigger span::after { top: 8px; }

        .menu-panel { position: absolute; top: calc(50% + 58px); left: 50%; transform: translateX(-50%) translateY(10px) scale(.98); background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)), rgba(28,28,30,0.98); padding: 8px; border-radius: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 120px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .22s cubic-bezier(.2,.9,.2,1); z-index: 5; backdrop-filter: blur(6px); }
        .menu-item { color: #fff; text-decoration: none; padding: 8px 12px; font-size: 14px; border-radius: 6px; transition: background .12s ease; }
        .menu-item:hover { background: rgba(255,255,255,0.04); }

        .menu-area:hover .menu-panel, .menu-area:focus-within .menu-panel { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); pointer-events: auto; }
        .menu-area:hover .menu-trigger { transform: scale(.96); }

        /* 点击切换（用于手机/触摸设备） */
        .menu-area::before { content: ''; position: absolute; inset: 0; border-radius: 6px; background: radial-gradient(circle at center, rgba(0,0,0,0.12), rgba(0,0,0,0.5)); opacity: 0; transition: opacity .25s ease; pointer-events: none; }
        .menu-area.open::before { opacity: 1; }
        .menu-area.open .menu-panel { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); pointer-events: auto; }

        /* 小屏幕上微调：菜单靠下显示且保持可点击 */
        @media (max-width: 420px) {
            .poster-image .menu-area { width: 110px; height: 110px; }
            .menu-panel { top: calc(50% + 62px); min-width: 100px; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="scene" id="scene">
        <div class="layer-back">TANG ZE ZHEN</div>

        <div class="poster-frame">
            <div class="header">
                <div class="title-group">
                    <h1>唐择镇的博客</h1>
                    <p>VISUAL ARCHIVE // 2026</p>
                </div>
                <div class="time-code" id="time-code">00:00:00:00</div>
            </div>

            <div class="poster-image">
                <div class="menu-area" aria-hidden="false">
                    <div class="menu-trigger" tabindex="0" title="菜单">
                        <span></span>
                    </div>

                    <div class="menu-backdrop" aria-hidden="true"></div>

                    <nav class="menu-panel" role="menu" aria-label="主菜单">
                        <a class="menu-item" href="#" role="menuitem">首页</a>
                        <a class="menu-item" href="#" role="menuitem">归档</a>
                        <a class="menu-item" href="#" role="menuitem">关于</a>
                        <a class="menu-item" href="#" role="menuitem">联系</a>
                    </nav>
                </div>

                <div style="position:absolute; bottom:15px; left:15px; color:white; font-size:24px; font-weight:100; opacity:0.3;">
                    [ 思考 / 留白 ]
                </div>
            </div>

            <div class="footer-info">
                <div class="meta-row">
                    <span class="meta-label">项目 / PROJECT</span>
                    <span class="meta-val">个人博文存档</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">状态 / STATUS</span>
                    <span class="meta-val" style="color: var(--accent-red);">LIVE</span>
                </div>
            </div>
        </div>

        
    </div>

    <script>
        const scene = document.getElementById('scene');
        const timeCodeEl = document.getElementById('time-code');

        // 兼容 PC 鼠标和手机陀螺仪
        function handleMove(x, y) {
            const rotX = (y / window.innerHeight - 0.5) * -30;
            const rotY = (x / window.innerWidth - 0.5) * 30;
            scene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        }

        // PC端鼠标事件
        document.addEventListener('mousemove', (e) => {
            handleMove(e.pageX, e.pageY);
        });

        // 手机端加速度计（可选：需用户交互触发权限）
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if(e.beta && e.gamma) {
                    // beta: 前后倾斜 (-180 to 180)
                    // gamma: 左右倾斜 (-90 to 90)
                    const x = (e.gamma + 45) * (window.innerWidth / 90);
                    const y = (e.beta - 45) * (window.innerHeight / 90);
                    handleMove(x, y);
                }
            }, true);
        }

        // 时间码逻辑
        let frames = 0;
        function updateTime() {
            frames++;
            const totalSeconds = Math.floor(frames / 30);
            const f = (frames % 30).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            const m = (Math.floor(totalSeconds / 60) % 60).toString().padStart(2, '0');
            const h = (Math.floor(totalSeconds / 3600)).toString().padStart(2, '0');
            timeCodeEl.textContent = `${h}:${m}:${s}:${f}`;
            requestAnimationFrame(updateTime);
        }
        updateTime();
        
        // 手机/触摸设备：点击切换菜单并支持点击外部关闭
        (function(){
            const area = document.querySelector('.menu-area');
            const trigger = area && area.querySelector('.menu-trigger');
            const panel = area && area.querySelector('.menu-panel');

            if(!area || !trigger || !panel) return;

            // 切换 open 类
            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                area.classList.toggle('open');
            });

            // 点击面板内不会关闭（阻止冒泡）
            panel.addEventListener('click', (e) => e.stopPropagation());

            // 点击页面其他地方关闭（手机友好）
            document.addEventListener('click', () => {
                area.classList.remove('open');
            });

            // 键盘 Esc 关闭
            window.addEventListener('keydown', (e) => {
                if(e.key === 'Escape') area.classList.remove('open');
            });
        })();
    </script>
</body>
</html>
