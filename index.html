<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>唐择镇的个人界面</title>
    <style>
        :root {
            --paper-white: #f5f5f7;
            --accent-red: #ff3b30;
            --text-dim: #86868b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #0a0b10; 
            color: #1d1d1f;
            font-family: -apple-system, sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            perspective: 2000px;
        }

        .particles {
            position: fixed; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            transform-style: preserve-3d;
        }
        .dot {
            position: absolute; background: white; border-radius: 50%;
            opacity: 0.2; animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: translateZ(var(--z)) scale(0.8); }
            50% { opacity: 0.6; transform: translateZ(var(--z)) scale(1.2); }
        }

        .layer-back {
            position: absolute; font-size: 18vw; font-weight: 900;
            color: rgba(255,255,255,0.03); transform: translate3d(0, 0, -500px);
            user-select: none; white-space: nowrap; z-index: 1;
            letter-spacing: -5px; pointer-events: none;
        }

        .scene {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            transform-style: preserve-3d;
        }

        .poster-frame {
            position: relative; width: 85%; max-width: 380px; aspect-ratio: 3 / 4.2;
            background: var(--paper-white); 
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            padding: 25px; display: flex; flex-direction: column;
            justify-content: space-between; z-index: 10;
            transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .poster-image {
            flex-grow: 1; margin: 15px 0; background: #000;
            position: relative; overflow: hidden; border-radius: 2px;
            display: flex; justify-content: center; align-items: center;
        }

        .inner-grid {
            position: absolute; width: 200%; height: 200%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotateX(65deg) translateY(0);
            animation: grid-run 10s linear infinite;
            pointer-events: none; 
            z-index: 1;
        }

        @keyframes grid-run {
            from { transform: rotateX(65deg) translateY(0); }
            to { transform: rotateX(65deg) translateY(40px); }
        }

        .nav-container { 
            width: 100%; height: 100%; 
            display: flex; flex-direction: column; 
            z-index: 10; 
            position: relative;
        }

        .nav-rail {
            flex: 1; display: flex; justify-content: center; align-items: center;
            cursor: pointer; position: relative;
            background: transparent; 
            transition: background 0.3s;
            text-decoration: none;
        }

        .nav-item {
            color: rgba(255,255,255,0.3); font-size: 1.5rem; font-weight: 800;
            letter-spacing: 0.4em; transition: all 0.3s ease;
            pointer-events: none; 
        }

        @media (hover: hover) {
            .nav-rail:hover .nav-item {
                color: rgba(255,255,255,0.8);
                transform: scale(1.1);
            }
        }

        .nav-rail.active .nav-item {
            color: var(--accent-red) !important;
            transform: scale(1.1);
            text-shadow: 0 0 15px rgba(255, 59, 48, 0.4);
        }

        .status-bar { display: flex; justify-content: space-between; border-top: 1px solid #eee; padding-top: 15px; }
        #status-text { font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        .time-code { font-family: monospace; color: var(--accent-red); font-size: 12px; }
        .title-group h1 { font-size: 18px; letter-spacing: 2px; }
        .deco-side { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; font-size: 8px; color: var(--accent-red); letter-spacing: 3px; opacity: 0.5; pointer-events: none;}
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>
    <div class="layer-back" id="back-name">TANG ZE ZHEN</div>

    <div class="scene" id="scene">
        <div class="poster-frame" id="poster">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div class="title-group">
                    <h1>唐择镇</h1>
                    <p style="font-size: 9px; color: var(--text-dim);">SYSTEM VER 2.0.26</p>
                </div>
                <div class="time-code" id="time-code">00:00:00:00</div>
            </div>

            <div class="poster-image">
                <div class="inner-grid" id="grid"></div>
                <div class="deco-side">COMMUNICATION</div>
                <nav class="nav-container">
                    <a href="https://tangzezhen2003.vip/1" class="nav-rail" data-label="PROFILE"><span class="nav-item">简介</span></a>
                    <a href="https://tangzezhen2003.vip/2" class="nav-rail" data-label="THEORY"><span class="nav-item">理论</span></a>
                    <a href="https://tangzezhen2003.vip/3" class="nav-rail" data-label="ARCHIVE"><span class="nav-item">文本</span></a>
                    <a href="https://tangzezhen2003.vip/4" class="nav-rail" data-label="VISION"><span class="nav-item">影像</span></a>
                </nav>
            </div>

            <div class="status-bar">
                <div id="status-text">SYSTEM READY<span class="blink">_</span></div>
                <div style="font-size: 10px; font-weight: bold;">MFA / 2026</div>
            </div>
        </div>
    </div>

    <script>
        const poster = document.getElementById('poster');
        const backName = document.getElementById('back-name');
        const grid = document.getElementById('grid');
        const statusText = document.getElementById('status-text');

        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;

        function handleMove(x, y) {
            targetX = (x / window.innerWidth - 0.5) * 40;
            targetY = (y / window.innerHeight - 0.5) * 40;
        }

        window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if(e.gamma) {
                    targetX = Math.min(Math.max(e.gamma, -30), 30);
                    targetY = Math.min(Math.max(e.beta - 45, -30), 30);
                }
            });
        }

        function updateParallax() {
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;
            poster.style.transform = `rotateY(${currentX}deg) rotateX(${-currentY}deg)`;
            backName.style.transform = `translate3d(${-currentX * 6}px, ${-currentY * 6}px, -500px)`;
            requestAnimationFrame(updateParallax);
        }
        updateParallax();

        const navRails = document.querySelectorAll('.nav-rail');
        
        function onAction(rail) {
            navRails.forEach(r => r.classList.remove('active'));
            rail.classList.add('active');
            
            grid.style.animationDuration = '1s';
            
            const label = rail.getAttribute('data-label');
            statusText.innerHTML = `LOADING ${label}<span class="blink">...</span>`;

            setTimeout(() => {
                grid.style.animationDuration = '10s';
            }, 500);
        }

        navRails.forEach(rail => {
            rail.addEventListener('click', () => onAction(rail));
        });

        setInterval(() => {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ms = String(Math.floor(now.getMilliseconds() / 10)).padStart(2, '0');
            document.getElementById('time-code').textContent = `${h}:${m}:${s}:${ms}`;
        }, 40);

        const partContainer = document.getElementById('particles');
        for(let i=0; i<60; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            const size = Math.random() * 2;
            dot.style.cssText = `width:${size}px; height:${size}px; left:${Math.random()*100}%; top:${Math.random()*100}%; --z:${Math.random()*1000-500}px; --duration:${2+Math.random()*3}s;`;
            partContainer.appendChild(dot);
        }
    </script>
</body>
</html>
