<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>唐择镇的个人界面</title>
    <style>
        :root {
            --paper-white: #f5f5f7;
            --paper-gray: #e5e5e7;
            --accent-black: #1d1d1f;
            --accent-red: #ff3b30;
            --text-dim: #86868b;
            --glow-color: rgba(255, 255, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #0a0b10; 
            color: var(--accent-black);
            font-family: -apple-system, "SF Pro SC", "PingFang SC", "STHeiti", sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            perspective: 2000px;
        }

        .particles {
            position: fixed; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            transform-style: preserve-3d;
        }
        .dot {
            position: absolute; background: white; border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 5px white;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: translateZ(var(--z)) scale(0.8); }
            50% { opacity: var(--max-opacity); transform: translateZ(var(--z)) scale(1.2); }
        }

        .layer-back {
            position: absolute; font-size: 18vw; font-weight: 900;
            color: rgba(255,255,255,0.03); transform: translate3d(0, 0, -500px);
            user-select: none; white-space: nowrap; z-index: 1;
            letter-spacing: -5px; pointer-events: none;
        }

        .scene {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .poster-frame {
            position: relative; width: 90%; max-width: 420px; aspect-ratio: 3 / 4;
            background: var(--paper-white); 
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            padding: 30px; display: flex; flex-direction: column;
            justify-content: space-between; z-index: 10;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .poster-frame::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                        rgba(255,255,255,0.2) 0%, transparent 60%);
            pointer-events: none;
        }

        .poster-image {
            flex-grow: 1; margin: 20px 0; background: #000;
            position: relative; overflow: hidden; border-radius: 2px;
            display: flex; justify-content: center; align-items: center;
            perspective: 1000px;
        }

        .inner-grid {
            position: absolute; width: 200%; height: 200%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(70deg) translateY(-20%);
            animation: grid-move 15s linear infinite;
        }

        @keyframes grid-move {
            from { transform: rotateX(70deg) translateY(0); }
            to { transform: rotateX(70deg) translateY(50px); }
        }

        /* --- 优化后的点击区域 --- */
        .nav-container { 
            position: relative; 
            z-index: 5; 
            width: 100%; 
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .nav-rail {
            width: 100%; 
            height: 22%; /* 使用百分比平分高度，确保热区最大化 */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative;
            cursor: pointer; 
            /* 增加一个几乎透明的背景，让浏览器更容易捕捉点击 */
            background: rgba(255,255,255,0.001); 
            transition: all 0.3s ease;
            user-select: none;
        }

        .nav-item {
            color: rgba(255,255,255,0.2); 
            font-size: 1.6rem; 
            font-weight: 800;
            letter-spacing: 0.5em; 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none; /* 防止文字干扰轨道点击 */
        }

        .nav-rail:hover .nav-item {
            color: #fff; 
            transform: scale(1.15) translateZ(40px);
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

        /* 点击那一瞬间的物理反馈 */
        .nav-rail:active .nav-item {
            transform: scale(0.9) translateZ(10px);
            transition: transform 0.1s;
        }

        .nav-rail.active .nav-item {
            color: var(--accent-red) !important;
            text-shadow: 0 0 20px rgba(255, 59, 48, 0.6);
        }

        .deco-text {
            position: absolute; font-size: 9px; color: var(--accent-red);
            bottom: 20px; right: 20px; opacity: 0.8; letter-spacing: 2px;
            writing-mode: vertical-lr;
            pointer-events: none;
        }

        .title-group h1 { font-size: 20px; font-weight: 900; letter-spacing: 2px; }
        .title-group p { font-size: 10px; color: var(--text-dim); margin-top: 5px; font-weight: 500;}
        .time-code { font-family: 'Courier New', monospace; font-size: 13px; color: var(--accent-red); text-shadow: 0 0 5px rgba(255,59,48,0.3); }

        .footer-info { border-top: 1px solid #eee; padding-top: 15px; }
        .meta-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 10px; }
        .meta-label { color: var(--text-dim); }
        .meta-val { font-weight: 600; }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="scene" id="scene">
        <div class="layer-back" id="back-name">TANG ZE ZHEN</div>

        <div class="poster-frame" id="poster">
            <div class="header">
                <div class="title-group">
                    <h1>唐择镇</h1>
                    <p>个人档案 / 2026</p>
                </div>
                <div class="time-code" id="time-code">00:00:00:00</div>
            </div>

            <div class="poster-image">
                <div class="inner-grid"></div>
                
                <nav class="nav-container" id="main-nav">
                    <div class="nav-rail" data-label="简介"><span class="nav-item">简介</span></div>
                    <div class="nav-rail" data-label="理论"><span class="nav-item">理论</span></div>
                    <div class="nav-rail" data-label="文本"><span class="nav-item">文本</span></div>
                    <div class="nav-rail" data-label="影像"><span class="nav-item">影像</span></div>
                </nav>

                <div class="deco-text"> MENU </div>
            </div>

            <div class="footer-info">
                <div class="meta-row">
                    <span class="meta-label">专业</span>
                    <span class="meta-val">戏剧与影视</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">状态</span>
                    <span class="meta-val" id="status-text" style="color: var(--accent-red);">准备就绪</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const poster = document.getElementById('poster');
        const backName = document.getElementById('back-name');
        const particlesContainer = document.getElementById('particles');
        const timeCodeEl = document.getElementById('time-code');
        const statusText = document.getElementById('status-text');

        // 星丛生成
        function createConstellation() {
            const count = 80;
            for (let i = 0; i < count; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                const size = Math.random() * 2 + (Math.random() > 0.9 ? 2 : 0.5);
                const z = Math.random() * 800 - 400;
                const duration = 3 + Math.random() * 5;
                const delay = Math.random() * -10;
                const maxOpacity = 0.2 + Math.random() * 0.5;
                dot.style.cssText = `width: ${size}px; height: ${size}px; left: ${Math.random() * 100}%; top: ${Math.random() * 100}%; --z: ${z}px; --duration: ${duration}s; --max-opacity: ${maxOpacity}; animation-delay: ${delay}s;`;
                particlesContainer.appendChild(dot);
            }
        }
        createConstellation();

        // 视差动效
        document.addEventListener('mousemove', (e) => {
            const xPct = e.clientX / window.innerWidth;
            const yPct = e.clientY / window.innerHeight;
            const rotX = (yPct - 0.5) * -15;
            const rotY = (xPct - 0.5) * 15;
            poster.style.setProperty('--mouse-x', `${xPct * 100}%`);
            poster.style.setProperty('--mouse-y', `${yPct * 100}%`);
            requestAnimationFrame(() => {
                scene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
                backName.style.transform = `translate3d(${(xPct-0.5)*-120}px, ${(yPct-0.5)*-60}px, -500px)`;
            });
        });

        // --- 核心优化：点击逻辑 ---
        const navRails = document.querySelectorAll('.nav-rail');
        
        function handleNavigation(e) {
            // 阻止默认行为（如移动端双击缩放）
            if (e.type === 'touchstart') e.preventDefault();
            
            const rail = e.currentTarget;
            const targetName = rail.getAttribute('data-label');

            // 1. 视觉激活态
            navRails.forEach(r => r.classList.remove('active'));
            rail.classList.add('active');

            // 2. 交互反馈
            statusText.textContent = `载入中: ${targetName}`;
            statusText.style.color = "var(--accent-red)";
            
            // 模拟“确认”震动感
            poster.style.transition = "transform 0.1s ease-out";
            poster.style.transform = "scale(0.97) translateZ(-30px)";
            
            setTimeout(() => {
                poster.style.transition = "transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
                poster.style.transform = "scale(1) translateZ(0)";
                statusText.textContent = `已进入: ${targetName}`;
            }, 150);

            // 这里可以添加具体的页面跳转逻辑，例如：
            // console.log("Navigate to:", targetName);
        }

        navRails.forEach(rail => {
            // 同时监听点击和触摸，提升响应速度
            rail.addEventListener('click', handleNavigation);
            rail.addEventListener('touchstart', handleNavigation, {passive: false});
        });

        // 计时器
        let frames = 0;
        function updateTime() {
            frames++;
            const f = (frames % 24).toString().padStart(2, '0');
            const s = (Math.floor(frames / 24) % 60).toString().padStart(2, '0');
            const m = (Math.floor(frames / 1440) % 60).toString().padStart(2, '0');
            const h = (Math.floor(frames / 86400)).toString().padStart(2, '0');
            timeCodeEl.textContent = `${h}:${m}:${s}:${f}`;
            requestAnimationFrame(updateTime);
        }
        updateTime();
    </script>
</body>
</html>
