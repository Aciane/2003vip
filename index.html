<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>唐择镇的个人界面 - 微观交互版</title>
    <style>
        :root {
            --paper-white: #f5f5f7;
            --accent-red: #ff3b30;
            --text-dim: #86868b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #0a0b10; color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            perspective: 1000px;
        }

        /* --- 装饰层：响应微观位移 --- */
        .deco-layer {
            position: fixed; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .layer-back {
            position: absolute; font-size: 15vw; font-weight: 900;
            color: rgba(255,255,255,0.02); left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap; transition: transform 0.2s ease-out;
        }

        /* --- 核心容器：保持绝对静止以保证点击 --- */
        .poster-frame {
            position: relative; width: 88%; max-width: 380px; aspect-ratio: 3 / 4.2;
            background: var(--paper-white); 
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
            padding: 25px; display: flex; flex-direction: column;
            justify-content: space-between; z-index: 10;
        }

        .poster-image {
            flex-grow: 1; margin: 15px 0; background: #000;
            position: relative; overflow: hidden; border-radius: 2px;
            display: flex; justify-content: center; align-items: center;
        }

        /* 内部 3D 网格：响应微观旋转 */
        .inner-grid {
            position: absolute; width: 150%; height: 150%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotateX(65deg); /* 基础倾角 */
            transition: transform 0.3s ease-out;
            z-index: 1;
        }

        /* --- 交互 UI：绝对精准 --- */
        .nav-container { 
            width: 100%; height: 100%; 
            display: flex; flex-direction: column; 
            position: relative; z-index: 20;
        }

        .nav-rail {
            flex: 1; display: flex; justify-content: center; align-items: center;
            text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.1);
            background: transparent; transition: background 0.3s;
        }

        .nav-item {
            color: rgba(255,255,255,0.4); font-size: 1.4rem; font-weight: 800;
            letter-spacing: 0.5em; transition: 0.3s;
        }

        /* 鼠标悬停时的微观反馈 */
        .nav-rail:hover .nav-item {
            color: #fff; letter-spacing: 0.6em;
        }

        .nav-rail.active .nav-item {
            color: var(--accent-red);
            text-shadow: 0 0 15px rgba(255, 59, 48, 0.8);
        }

        /* 装饰元素 */
        .status-bar { display: flex; justify-content: space-between; border-top: 1px solid #ddd; padding-top: 15px; }
        .time-code { font-family: monospace; color: var(--accent-red); font-size: 12px; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="deco-layer">
        <div class="layer-back" id="back-name">TANG ZE ZHEN</div>
    </div>

    <div class="poster-frame">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div class="title-group">
                <h1 style="font-size: 18px; letter-spacing: 2px;">唐择镇</h1>
                <p style="font-size: 9px; color: var(--text-dim);">DYNAMICS ENABLED</p>
            </div>
            <div class="time-code" id="time-code">00:00:00:00</div>
        </div>

        <div class="poster-image">
            <div class="inner-grid" id="grid"></div>
            
            <nav class="nav-container">
                <a href="#" class="nav-rail" data-label="PROFILE"><span class="nav-item">简介</span></a>
                <a href="#" class="nav-rail" data-label="THEORY"><span class="nav-item">理论</span></a>
                <a href="#" class="nav-rail" data-label="ARCHIVE"><span class="nav-item">文本</span></a>
                <a href="#" class="nav-rail" data-label="VISION"><span class="nav-item">影像</span></a>
            </nav>
        </div>

        <div class="status-bar">
            <div id="status-text" style="font-size: 10px; font-weight: 700;">SYSTEM ACTIVE<span class="blink">_</span></div>
            <div style="font-size: 10px; font-weight: bold;">2026 / MFA</div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const backName = document.getElementById('back-name');

        // --- 微观交互逻辑 ---
        // 我们不旋转整个卡片，只旋转内部的 3D 网格和背景名字
        window.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX / window.innerWidth - 0.5) * 20;
            const moveY = (e.clientY / window.innerHeight - 0.5) * 20;

            // 1. 内部网格微调旋转 (只在 65deg 基础上偏移 +/- 5deg)
            grid.style.transform = `rotateX(${65 + moveY * 0.5}deg) rotateZ(${moveX * 0.2}deg)`;
            
            // 2. 背景文字微调位移 (Parallax)
            backName.style.transform = `translate(calc(-50% + ${-moveX * 2}px), calc(-50% + ${-moveY * 2}px))`;
        });

        // 导航点击
        const navRails = document.querySelectorAll('.nav-rail');
        navRails.forEach(rail => {
            rail.addEventListener('mouseenter', () => {
                // 悬停时背景网格产生扰动感
                grid.style.transition = '0.1s';
                grid.style.filter = 'brightness(2)';
            });
            rail.addEventListener('mouseleave', () => {
                grid.style.transition = '0.3s';
                grid.style.filter = 'brightness(1)';
            });
            rail.addEventListener('click', function(e) {
                e.preventDefault();
                navRails.forEach(r => r.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 时钟
        setInterval(() => {
            const now = new Date();
            document.getElementById('time-code').textContent = 
                `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}:${Math.floor(now.getMilliseconds()/10)}`;
        }, 40);
    </script>
</body>
</html>
