<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>唐择镇的博客</title>
    <style>
        :root {
            --paper-white: #f5f5f7;
            --paper-gray: #e5e5e7;
            --accent-black: #1d1d1f;
            --accent-red: #ff3b30;
            --text-dim: #86868b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--paper-white);
            color: var(--accent-black);
            font-family: -apple-system, "SF Pro SC", "PingFang SC", system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, #d1d1d6 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.3;
            z-index: -1;
        }

        .scene {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* 背景装饰：在手机上调小字号 */
        .layer-back {
            position: absolute;
            font-size: 15vw;
            font-weight: 900;
            color: var(--paper-gray);
            transform: translate3d(0, 0, -150px);
            user-select: none;
            white-space: nowrap;
            z-index: 1;
        }

        /* 核心卡片容器：响应式关键 */
        .poster-frame {
            position: relative;
            width: 90%;
            max-width: 400px; /* PC端最大宽度 */
            aspect-ratio: 3 / 4; /* 保持海报比例 */
            background: white;
            box-shadow: 0 30px 60px rgba(0,0,0,0.12);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            transform: translate3d(0, 0, 0);
        }

        .poster-image {
            flex-grow: 1;
            margin: 20px 0;
            background: #1c1c1e;
            position: relative;
            overflow: hidden;
            border-radius: 1px;
        }

        .poster-image::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.05) 45%, transparent 50%);
            animation: light-sweep 4s infinite;
        }

        @keyframes light-sweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 标签：手机端自动调整 */
        .layer-front {
            position: absolute;
            z-index: 20;
            transform: translate3d(0, 0, 40px);
            pointer-events: none;
        }

        .tag {
            background: var(--accent-black);
            color: white;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .title-group h1 { font-size: 20px; font-weight: 800; }
        .title-group p { font-size: 9px; color: var(--text-dim); margin-top: 4px; }
        .time-code { font-family: monospace; font-size: 12px; color: var(--accent-red); }

        .footer-info { border-top: 1px solid #eee; padding-top: 15px; }
        .meta-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 10px; }
        .meta-label { color: var(--text-dim); }

        /* 响应式微调 */
        @media (max-height: 700px) {
            .poster-frame { padding: 20px; }
            .poster-image { margin: 10px 0; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="scene" id="scene">
        <div class="layer-back">TANG ZE ZHEN</div>

        <div class="poster-frame">
            <div class="header">
                <div class="title-group">
                    <h1>唐择镇的博客</h1>
                    <p>VISUAL ARCHIVE // 2026</p>
                </div>
                <div class="time-code" id="time-code">00:00:00:00</div>
            </div>

            <div class="poster-image">
                <div style="position:absolute; bottom:15px; left:15px; color:white; font-size:24px; font-weight:100; opacity:0.3;">
                    [ 思考 / 留白 ]
                </div>
            </div>

            <div class="footer-info">
                <div class="meta-row">
                    <span class="meta-label">项目 / PROJECT</span>
                    <span class="meta-val">个人博文存档</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">状态 / STATUS</span>
                    <span class="meta-val" style="color: var(--accent-red);">LIVE</span>
                </div>
            </div>
        </div>

        <div class="layer-front" style="top: 25%; left: 10%;">
            <div class="tag">BLOG_3.0</div>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const timeCodeEl = document.getElementById('time-code');

        // 兼容 PC 鼠标和手机陀螺仪
        function handleMove(x, y) {
            const rotX = (y / window.innerHeight - 0.5) * -30;
            const rotY = (x / window.innerWidth - 0.5) * 30;
            scene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        }

        // PC端鼠标事件
        document.addEventListener('mousemove', (e) => {
            handleMove(e.pageX, e.pageY);
        });

        // 手机端加速度计（可选：需用户交互触发权限）
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if(e.beta && e.gamma) {
                    // beta: 前后倾斜 (-180 to 180)
                    // gamma: 左右倾斜 (-90 to 90)
                    const x = (e.gamma + 45) * (window.innerWidth / 90);
                    const y = (e.beta - 45) * (window.innerHeight / 90);
                    handleMove(x, y);
                }
            }, true);
        }

        // 时间码逻辑
        let frames = 0;
        function updateTime() {
            frames++;
            const totalSeconds = Math.floor(frames / 30);
            const f = (frames % 30).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            const m = (Math.floor(totalSeconds / 60) % 60).toString().padStart(2, '0');
            const h = (Math.floor(totalSeconds / 3600)).toString().padStart(2, '0');
            timeCodeEl.textContent = `${h}:${m}:${s}:${f}`;
            requestAnimationFrame(updateTime);
        }
        updateTime();
    </script>
</body>
</html>
