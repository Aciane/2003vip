<!DOCTYPE html>
<html lang="zh" data-theme="immersive">
<head><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>她</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
        }
        canvas { 
            display: block; 
        }

        /* 不明所以的线 */
        #chaos-line {
            position: absolute;
            bottom: 12%; 
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            -webkit-appearance: none;
            background: rgba(0, 255, 255, 0.15); /* 极暗的底线 */
            height: 1px;
            outline: none;
            z-index: 999;
            transition: background 0.5s;
        }

        #chaos-line:hover {
            background: rgba(0, 255, 255, 0.4);
        }

        #chaos-line::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 2px;
            height: 14px;
            background: #00ffff;
            cursor: pointer;
            box-shadow: 0 0 10px #00ffff; /* 拖动点微微发光 */
        }
    </style>
<link rel="stylesheet" href="assets/site-theme.css">
</head>
<body class="site-page"><nav class="site-path" aria-label="站点导航"><a href="index.html">唐择镇 / 感知漫游</a><span>交互实验</span><a href="index.html#archive">文章目录 ↗</a></nav>

<input type="range" id="chaos-line" min="0.00" max="0.50" step="0.01" value="0.05">

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

    // 1. 基础配置
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.001, 5000);
    camera.position.set(0.4, 0, 1.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const CONF = {
        nodeCount: 300, 
        threshold: 0.18,
        chaosRange: 0.05, // 初始混沌值
        moveSpeed: 0.005,
        prob: 0.85,
        nodeColor: 0x002244,
        lineColor: 0x00ffff,
        maxTrails: 1200000 
    };

    let nodes = [];
    let group = new THREE.Group();
    scene.add(group);

    let trailGeom = new THREE.BufferGeometry();
    let trailPositions = new Float32Array(CONF.maxTrails * 3);
    trailGeom.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
    const trailMat = new THREE.LineBasicMaterial({
        color: CONF.lineColor, transparent: true, opacity: 0.05, blending: THREE.AdditiveBlending
    });
    let trailSegments = new THREE.LineSegments(trailGeom, trailMat);
    group.add(trailSegments);

    let trailIdx = 0;

    // --- 【极简交互逻辑】拖动即是混沌 ---
    document.getElementById('chaos-line').oninput = (e) => {
        CONF.chaosRange = parseFloat(e.target.value);
    };

    // --- 模型加载与散点生成 ---
    const loader = new GLTFLoader();
    loader.load('shao.glb', (gltf) => {
        const meshes = [];
        gltf.scene.traverse(child => { if (child.isMesh) meshes.push(child); });
        if (meshes.length > 0) {
            const box = new THREE.Box3().setFromObject(gltf.scene);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scaleFactor = 1.0 / maxDim;
            gltf.scene.position.sub(center);
            gltf.scene.scale.multiplyScalar(scaleFactor);
            gltf.scene.updateMatrixWorld(true); 

            const mainMesh = meshes.sort((a,b) => b.geometry.attributes.position.count - a.geometry.attributes.position.count)[0];
            const sampler = new MeshSurfaceSampler(mainMesh).build();
            const tempV = new THREE.Vector3();

            for (let i = 0; i < CONF.nodeCount; i++) {
                sampler.sample(tempV);
                tempV.applyMatrix4(mainMesh.matrixWorld); 
                nodes.push({
                    base: tempV.clone(), pos: tempV.clone(),
                    vel: new THREE.Vector3((Math.random()-0.5)*0.01, (Math.random()-0.5)*0.01, (Math.random()-0.5)*0.01)
                });
            }
            const pPoints = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: CONF.nodeColor, size: 0.005 }));
            group.add(pPoints);
            window.activePoints = pPoints;
            group.scale.set(2.5, 2.5, 2.5); // 锁定默认缩放值
        }
    });

    // --- 核心更新逻辑 ---
    function update() {
        if (!nodes.length) return;
        const positions = trailGeom.attributes.position.array;
        const currentCoords = [];

        nodes.forEach(n => {
            n.pos.add(n.vel.clone().normalize().multiplyScalar(CONF.moveSpeed));
            // 混沌值(chaosRange)直接影响粒子的游离半径
            if (n.pos.distanceTo(n.base) > CONF.chaosRange) n.vel.multiplyScalar(-1);
            n.vel.x += (Math.random() - 0.5) * 0.001; 
            n.vel.y += (Math.random() - 0.5) * 0.001; 
            n.vel.z += (Math.random() - 0.5) * 0.001;
            currentCoords.push(n.pos.x, n.pos.y, n.pos.z);
        });

        if (window.activePoints) {
            window.activePoints.geometry.setAttribute('position', new THREE.Float32BufferAttribute(currentCoords, 3));
        }

        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < Math.min(i + 30, nodes.length); j++) {
                const d2 = nodes[i].pos.distanceToSquared(nodes[j].pos);
                if (d2 < CONF.threshold * CONF.threshold && Math.random() > CONF.prob) {
                    if (trailIdx * 3 < CONF.maxTrails * 3 - 6) {
                        positions[trailIdx * 3] = nodes[i].pos.x;
                        positions[trailIdx * 3 + 1] = nodes[i].pos.y;
                        positions[trailIdx * 3 + 2] = nodes[i].pos.z;
                        positions[trailIdx * 3 + 3] = nodes[j].pos.x;
                        positions[trailIdx * 3 + 4] = nodes[j].pos.y;
                        positions[trailIdx * 3 + 5] = nodes[j].pos.z;
                        trailIdx += 2;
                    }
                }
            }
        }
        trailGeom.attributes.position.needsUpdate = true;
        trailGeom.setDrawRange(0, trailIdx);
    }

    function animate() {
        requestAnimationFrame(animate);
        update();
        group.rotation.y += 0.0012;
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
