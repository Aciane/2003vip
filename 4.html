<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VISION - 唐择镇</title>
    <style>
        :root {
            --paper-white: #f5f5f7;
            --accent-red: #ff3b30;
            --text-dim: #86868b;
            --overlay: rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #0a0b10; color: #1d1d1f;
            font-family: -apple-system, sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            perspective: 2000px;
        }

        /* 延续粒子背景 */
        .particles { position: fixed; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .dot { position: absolute; background: white; border-radius: 50%; opacity: 0.2; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.1; transform: translateZ(var(--z)) scale(0.8); } 50% { opacity: 0.6; transform: translateZ(var(--z)) scale(1.2); } }

        /* 卡片主框架 */
        .poster-frame {
            position: relative; width: 85%; max-width: 380px; aspect-ratio: 3 / 4.2;
            background: var(--paper-white); 
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            padding: 20px; display: flex; flex-direction: column;
            z-index: 10; transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-link { font-size: 10px; font-weight: 800; color: var(--accent-red); text-decoration: none; border: 1px solid var(--accent-red); padding: 2px 8px; }

        /* 影像网格区域 */
        .video-grid {
            flex-grow: 1; overflow-y: auto;
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            padding-right: 4px;
        }
        .video-grid::-webkit-scrollbar { width: 2px; }
        .video-grid::-webkit-scrollbar-thumb { background: var(--accent-red); }

        .video-card { text-decoration: none; color: inherit; display: flex; flex-direction: column; }

        /* 封面容器 */
        .cover-box {
            position: relative; width: 100%; aspect-ratio: 16 / 10;
            background: #e0e0e2; border-radius: 4px; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        .cover-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .video-card:hover img { transform: scale(1.1); }

        /* 模拟B站封面上的文字层 */
        .cover-stat {
            position: absolute; bottom: 0; width: 100%; padding: 4px 6px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: white; font-size: 8px; display: flex; justify-content: space-between;
        }

        .video-title {
            font-size: 11px; font-weight: 700; line-height: 1.4;
            margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden; transition: 0.3s;
        }
        .video-card:hover .video-title { color: var(--accent-red); }

        .section-tag { font-size: 16px; font-weight: 900; letter-spacing: 2px; margin-bottom: 2px; }
        .sub-tag { font-size: 8px; color: var(--text-dim); margin-bottom: 12px; letter-spacing: 1px; }

        .footer { margin-top: 10px; font-size: 9px; border-top: 1px solid #eee; padding-top: 10px; display: flex; justify-content: space-between; font-weight: bold; }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="scene">
        <div class="poster-frame" id="poster">
            <div class="header">
                <a href="javascript:history.back()" class="back-link">BACK</a>
                <div id="time-code" style="font-family: monospace; font-size: 10px; color: var(--accent-red);">00:00:00</div>
            </div>

            <div class="section-tag">VISION / 影像</div>
            <div class="sub-tag">EXPERIMENTAL VIDEO ARCHIVE 2.0.26</div>

            <div class="video-grid">
                <a href="#" class="video-card">
                    <div class="cover-box">
                        <img src="https://via.placeholder.com/320x200/333/fff?text=EPISODE+01" alt="">
                        <div class="cover-stat">
                            <span>▶ 1.2k</span><span>04:15</span>
                        </div>
                    </div>
                    <div class="video-title">跨维度叙事：关于光影的数字解构</div>
                </a>

                <a href="#" class="video-card">
                    <div class="cover-box">
                        <img src="https://via.placeholder.com/320x200/222/fff?text=EPISODE+02" alt="">
                        <div class="cover-stat">
                            <span>▶ 856</span><span>02:30</span>
                        </div>
                    </div>
                    <div class="video-title">城市呼吸：延时摄影下的控制论</div>
                </a>

                <a href="#" class="video-card">
                    <div class="cover-box">
                        <img src="https://via.placeholder.com/320x200/444/fff?text=EPISODE+03" alt="">
                        <div class="cover-stat">
                            <span>▶ 2.4k</span><span>12:00</span>
                        </div>
                    </div>
                    <div class="video-title">2026 MFA 毕业作品集前瞻</div>
                </a>

                <a href="#" class="video-card">
                    <div class="cover-box">
                        <img src="https://via.placeholder.com/320x200/111/fff?text=EPISODE+04" alt="">
                        <div class="cover-stat">
                            <span>▶ 512</span><span>01:45</span>
                        </div>
                    </div>
                    <div class="video-title">故障艺术实验：信号的坍塌</div>
                </a>

                <a href="#" class="video-card">
                    <div class="cover-box">
                        <img src="https://via.placeholder.com/320x200/555/fff?text=EPISODE+05" alt="">
                        <div class="cover-stat">
                            <span>▶ 1.1k</span><span>05:22</span>
                        </div>
                    </div>
                    <div class="video-title">虚拟现实中的触觉感知研究</div>
                </a>

                <a href="#" class="video-card">
                    <div class="cover-box">
                        <img src="https://via.placeholder.com/320x200/666/fff?text=EPISODE+06" alt="">
                        <div class="cover-stat">
                            <span>▶ 902</span><span>03:10</span>
                        </div>
                    </div>
                    <div class="video-title">黑白极简：光学的纯粹表达</div>
                </a>
            </div>

            <div class="footer">
                <div>MEDIA_STREAMING_ACTIVE</div>
                <div style="color: var(--accent-red);">VOL: 80%</div>
            </div>
        </div>
    </div>

    <script>
        const poster = document.getElementById('poster');
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;

        // 视差动效
        window.addEventListener('mousemove', (e) => {
            targetX = (e.clientX / window.innerWidth - 0.5) * 30;
            targetY = (e.clientY / window.innerHeight - 0.5) * 30;
        });

        function updateParallax() {
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;
            poster.style.transform = `rotateY(${currentX}deg) rotateX(${-currentY}deg)`;
            requestAnimationFrame(updateParallax);
        }
        updateParallax();

        // 粒子背景
        const partContainer = document.getElementById('particles');
        for(let i=0; i<40; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            const size = Math.random() * 2;
            dot.style.cssText = `width:${size}px; height:${size}px; left:${Math.random()*100}%; top:${Math.random()*100}%; --z:${Math.random()*1000-500}px; --duration:${2+Math.random()*3}s;`;
            partContainer.appendChild(dot);
        }
        
        // 时间代码
        setInterval(() => {
            const now = new Date();
            document.getElementById('time-code').textContent = now.toLocaleTimeString('en-GB');
        }, 1000);
    </script>
</body>
</html>
