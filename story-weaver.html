<!DOCTYPE html>
<html lang="zh-CN" data-theme="tool">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>故事织体 · 剧本素材选择填入框架</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --bg: #d4e8b4;
    --bg2: #e8dcc8;
    --panel: #fff8e7;
    --panel2: #fef5e0;
    --wood: #8b5a3c;
    --wood-dark: #5c3317;
    --wood-light: #c49a6c;
    --grass: #7ab648;
    --grass-dark: #5a8a2f;
    --sky: #87ceeb;
    --water: #5b8cbd;
    --sun: #ffd966;
    --sun-dark: #e6b800;
    --earth: #c65d35;
    --earth-dark: #8b3a1a;
    --stone: #8b8680;
    --text: #3e2723;
    --muted: #6b5544;
    --accent: #c65d35;
    --accent2: #c0392b;
    --v-id: #e74c3c;
    --v-de: #e67e22;
    --v-ac: #27ae60;
    --v-pr: #3498db;
    --v-ob: #8e44ad;
    --v-re: #16a085;
    --v-th: #f39c12;
    --chip-bg: #f0e6d3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle, rgba(122,182,72,0.12) 10%, transparent 10%),
      radial-gradient(circle, rgba(139,90,60,0.06) 8%, transparent 8%);
    background-size: 48px 48px, 64px 64px;
    background-position: 0 0, 24px 24px;
    color: var(--text); line-height: 1.7; min-height: 100vh;
    image-rendering: pixelated;
  }

  /* Pixel header bar */
  .app-header {
    background: linear-gradient(180deg, #5a8a2f 0%, #4a7a20 40%, #3d5c3a 100%);
    color: #fff8e7; padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    border-bottom: 4px solid var(--wood-dark);
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    image-rendering: pixelated;
  }
  .app-header h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.85rem; letter-spacing: 0; text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
    image-rendering: pixelated;
  }
  .app-header .subtitle { font-size: 0.65rem; opacity: 0.85; margin-left: 12px; letter-spacing: 0.5px; }
  .header-actions { display: flex; gap: 6px; }
  .header-actions button {
    font-family: 'Press Start 2P', monospace; font-size: 0.4rem;
    background: linear-gradient(180deg, #c49a6c 0%, #a0724a 100%);
    border: 2px solid var(--wood-dark); color: #fff8e7;
    padding: 6px 12px; cursor: pointer;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    transition: all 0.08s; text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
    image-rendering: pixelated;
  }
  .header-actions button:hover {
    background: linear-gradient(180deg, #d4aa7a 0%, #b0825a 100%);
  }
  .header-actions button:active {
    box-shadow: 0px 1px 0 rgba(0,0,0,0.3);
    transform: translateY(2px);
  }

  .main { max-width: 960px; margin: 0 auto; padding: 20px 20px 40px; }

  /* Tabs - like inventory tabs */
  .tabs {
    display: flex; gap: 0; margin-bottom: 0; flex-wrap: wrap;
    padding: 0 4px;
  }
  .tab {
    font-family: 'Press Start 2P', monospace;
    padding: 10px 14px 8px; cursor: pointer; font-size: 0.38rem;
    border: 3px solid transparent; border-bottom: none; border-radius: 0;
    color: var(--muted); background: rgba(255,255,255,0.4);
    transition: all 0.08s; white-space: nowrap;
    position: relative; margin-right: -3px;
    clip-path: polygon(6px 0%, calc(100% - 6px) 0%, 100% 100%, 0% 100%);
    image-rendering: pixelated; letter-spacing: 0;
  }
  .tab:hover {
    color: var(--text); background: rgba(255,255,255,0.7);
    border-color: var(--wood);
  }
  .tab.active {
    color: var(--text); background: var(--panel);
    border-color: var(--wood) var(--wood) transparent var(--wood);
    z-index: 2;
  }
  .tab.active::after {
    content: ""; position: absolute; bottom: -3px; left: 0; right: 0; height: 3px; background: var(--panel);
  }

  .panel { display: none; }
  .panel.active { display: block; }

  /* Section blocks - like game dialogue boxes */
  .section {
    background: var(--panel);
    border: 4px solid var(--wood-dark);
    border-radius: 0;
    padding: 20px 22px; margin-bottom: 16px;
    box-shadow:
      inset 0 0 0 3px var(--wood-light),
      4px 4px 0 rgba(0,0,0,0.15);
    position: relative;
  }
  .section::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--wood-dark) 0%, var(--wood-light) 30%, var(--wood-light) 70%, var(--wood-dark) 100%);
  }
  .section h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.6rem; color: var(--wood-dark); margin-bottom: 10px;
    padding-bottom: 6px; border-bottom: 2px dashed var(--wood);
    text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
    image-rendering: pixelated;
  }
  .section h3 {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.45rem; color: var(--wood-dark); margin: 16px 0 8px;
    image-rendering: pixelated;
  }
  .section .sec-desc { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }

  /* Input fields - like text boxes */
  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 0.75rem; font-weight: 600; color: var(--wood-dark);
    margin-bottom: 4px; letter-spacing: 0.3px;
  }
  .field textarea, .field input[type="text"] {
    width: 100%; padding: 8px 10px;
    border: 3px solid var(--wood);
    background: #fefdf6;
    color: var(--text); resize: vertical;
    font-family: inherit; font-size: 0.83rem;
    box-shadow: inset 2px 2px 0 rgba(0,0,0,0.08);
    transition: border-color 0.1s;
    image-rendering: pixelated;
  }
  .field textarea { min-height: 44px; }
  .field textarea:focus, .field input:focus {
    outline: none; border-color: var(--earth);
    box-shadow: inset 2px 2px 0 rgba(198,93,53,0.1), 0 0 0 3px rgba(198,93,53,0.15);
  }

  /* Material chips - like item sprites */
  .mat-bar { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; align-items: center; }
  .mat-bar .mat-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.35rem; color: var(--stone); margin-right: 4px; white-space: nowrap;
    image-rendering: pixelated;
  }
  .mat-chip {
    background: linear-gradient(180deg, #f5edd8 0%, #e8dcc8 100%);
    border: 2px solid var(--wood);
    padding: 3px 8px; font-size: 0.7rem; cursor: pointer; transition: all 0.08s;
    white-space: nowrap; user-select: none;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.12);
    image-rendering: pixelated;
  }
  .mat-chip:hover {
    background: linear-gradient(180deg, #fff3cd 0%, #ffe69c 100%);
    border-color: var(--earth);
    transform: translate(-1px, -1px);
    box-shadow: 3px 3px 0 rgba(0,0,0,0.15);
  }
  .mat-chip:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(0,0,0,0.1); }
  .mat-chip.used { opacity: 0.3; text-decoration: line-through; pointer-events: none; }
  .mat-chip.selected {
    background: linear-gradient(180deg, #d5f5e3 0%, #a8e6c1 100%);
    border-color: var(--grass); color: var(--grass-dark);
    box-shadow: 2px 2px 0 rgba(122,182,72,0.3);
  }

  /* Row layout */
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .row2, .row3 { grid-template-columns: 1fr; } }

  /* One sentence box - like a quest dialog */
  .one-sentence {
    background: linear-gradient(180deg, #fff8e0 0%, #fef0c0 100%);
    border: 4px solid var(--sun-dark);
    padding: 16px 20px; margin: 12px 0; font-size: 0.88rem;
    line-height: 1.9; text-align: center; min-height: 44px;
    box-shadow: inset 0 0 0 3px var(--sun), 3px 3px 0 rgba(0,0,0,0.15);
    position: relative;
  }
  .one-sentence::before {
    content: "★"; position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
    font-size: 1.4rem; color: var(--sun);
    text-shadow: 2px 2px 0 var(--sun-dark);
  }
  .one-sentence .placeholder { color: #b8a070; font-style: italic; }

  /* Seven voices table */
  .voice-table {
    width: 100%; border-collapse: collapse; font-size: 0.78rem;
    border: 3px solid var(--wood-dark);
    box-shadow: 3px 3px 0 rgba(0,0,0,0.12);
  }
  .voice-table th, .voice-table td {
    border: 2px solid var(--wood-light); padding: 7px 8px; text-align: left; vertical-align: top;
  }
  .voice-table th {
    background: linear-gradient(180deg, #e8dcc8 0%, #ddd0b8 100%);
    font-family: 'Press Start 2P', monospace; font-size: 0.35rem; color: var(--wood-dark);
    image-rendering: pixelated;
  }
  .voice-table .vl {
    font-weight: 600; text-align: center; width: 55px; font-size: 0.73rem;
    color: var(--wood-dark); background: rgba(0,0,0,0.03);
  }
  .voice-table .vl.id { border-left: 5px solid var(--v-id); }
  .voice-table .vl.de { border-left: 5px solid var(--v-de); }
  .voice-table .vl.ac { border-left: 5px solid var(--v-ac); }
  .voice-table .vl.pr { border-left: 5px solid var(--v-pr); }
  .voice-table .vl.ob { border-left: 5px solid var(--v-ob); }
  .voice-table .vl.re { border-left: 5px solid var(--v-re); }
  .voice-table .vl.th { border-left: 5px solid var(--v-th); }
  .voice-table .ci { font-size: 0.65rem; color: var(--muted); text-align: center; width: 55px; }
  .voice-table textarea, .voice-table input {
    width: 100%; border: none; background: transparent; font-family: inherit; font-size: 0.76rem;
    padding: 4px; color: var(--text);
  }
  .voice-table textarea:focus, .voice-table input:focus {
    outline: none; background: #fefdf6;
    box-shadow: inset 0 0 0 2px var(--earth);
  }
  .voice-table .mat-bar { padding: 3px 4px; }

  /* Act diagram - like a pixel path */
  .act-diagram {
    display: flex; gap: 0; margin: 12px 0;
    border: 4px solid var(--wood-dark);
    box-shadow: 4px 4px 0 rgba(0,0,0,0.15);
    overflow: hidden;
  }
  .act-block {
    flex: 1; padding: 14px 10px; text-align: center; font-size: 0.73rem;
    border-right: 2px solid rgba(0,0,0,0.1);
  }
  .act-block:last-child { border-right: none; }
  .act-block.a1 { background: linear-gradient(180deg, #ffe8c8 0%, #fdd9a8 100%); }
  .act-block.a2a { background: linear-gradient(180deg, #d5f5e3 0%, #b8e8cc 100%); }
  .act-block.a2b { background: linear-gradient(180deg, #d6eaf8 0%, #b8d8f0 100%); }
  .act-block.a3 { background: linear-gradient(180deg, #fadbd8 0%, #f5b8b0 100%); }
  .act-block .an {
    font-family: 'Press Start 2P', monospace; font-size: 0.45rem;
    margin-bottom: 4px; image-rendering: pixelated;
  }
  .act-block .at { font-size: 0.65rem; color: var(--muted); }

  /* Timeline */
  .timeline { position: relative; padding: 8px 0; }
  .timeline::before {
    content: ""; position: absolute; left: 72px; top: 0; bottom: 0;
    width: 4px; background: repeating-linear-gradient(0deg, var(--wood) 0px, var(--wood) 6px, transparent 6px, transparent 12px);
  }
  .tl-ev { display: flex; align-items: flex-start; margin-bottom: 5px; position: relative; padding: 5px 0; }
  .tl-ev .tl-tm {
    width: 62px; text-align: right; padding-right: 18px;
    font-family: 'Press Start 2P', monospace; font-size: 0.3rem;
    color: var(--wood-dark); flex-shrink: 0; padding-top: 5px;
    image-rendering: pixelated;
  }
  .tl-ev .tl-dot {
    width: 14px; height: 14px; flex-shrink: 0;
    position: absolute; left: 66px; top: 9px; z-index: 2;
    border: 3px solid var(--wood-dark); background: var(--wood-light);
    box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
  }
  .tl-ev.kp .tl-dot {
    background: var(--accent2);
    width: 18px; height: 18px; left: 64px; top: 7px;
    border-color: #8b1a1a;
    animation: pulse-dot 1.5s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.5); }
    50% { box-shadow: 0 0 0 8px rgba(192,57,43,0); }
  }
  .tl-ev .tl-card {
    margin-left: 26px; flex: 1;
    background: var(--panel2);
    border: 3px solid var(--wood-light);
    padding: 10px 14px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
    transition: border-color 0.1s;
  }
  .tl-ev.kp .tl-card {
    border-color: var(--accent2); border-width: 3px;
    box-shadow: 3px 3px 0 rgba(192,57,43,0.2);
  }
  .tl-card .tl-nm { font-weight: 700; font-size: 0.82rem; display: flex; align-items: center; gap: 6px; }
  .tl-card .tl-ds { font-size: 0.68rem; color: var(--muted); margin-bottom: 5px; }
  .tl-card .tl-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 5px; }
  .tl-card .tl-tag {
    font-size: 0.6rem; background: var(--chip-bg); padding: 2px 6px;
    color: var(--muted); border: 1px solid var(--wood-light);
  }
  .key-badge {
    background: var(--accent2); color: #fff; font-size: 0.55rem;
    padding: 2px 6px; font-family: 'Press Start 2P', monospace;
    image-rendering: pixelated;
  }
  .tl-card textarea {
    width: 100%; border: 2px dashed var(--wood-light);
    padding: 6px 8px; font-family: inherit; font-size: 0.73rem;
    resize: vertical; min-height: 36px; background: #fefdf6;
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.04);
  }
  .tl-card textarea:focus { outline: none; border-color: var(--earth); }

  /* Sequence grid */
  .seq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .seq-card {
    background: var(--panel2); border: 3px solid var(--wood-light);
    padding: 12px 14px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
    transition: border-color 0.1s;
  }
  .seq-card:hover { border-color: var(--wood); }
  .seq-card h4 { font-size: 0.78rem; margin-bottom: 3px; color: var(--wood-dark); }
  .seq-card .sr { font-size: 0.65rem; color: var(--muted); margin-bottom: 5px; }
  .seq-card textarea {
    width: 100%; border: 2px dashed var(--wood-light);
    padding: 5px; font-family: inherit; font-size: 0.7rem;
    resize: vertical; min-height: 40px; background: #fefdf6;
  }
  .seq-card textarea:focus { outline: none; border-color: var(--earth); }

  /* Character cards */
  .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .char-card {
    background: var(--panel2); border: 3px solid var(--wood-light);
    padding: 14px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
  }
  .char-card h4 {
    font-family: 'Press Start 2P', monospace; font-size: 0.45rem;
    margin-bottom: 8px; color: var(--wood-dark);
    border-bottom: 2px dashed var(--wood-light); padding-bottom: 6px;
    image-rendering: pixelated;
  }
  .char-field { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; margin-bottom: 5px; }
  .char-field label {
    width: 48px; font-weight: 600; color: var(--wood-dark);
    flex-shrink: 0; font-size: 0.68rem;
  }
  .char-field input {
    flex: 1; border: 2px solid var(--wood-light);
    padding: 4px 6px; font-family: inherit; font-size: 0.73rem;
    background: #fefdf6; box-shadow: inset 1px 1px 0 rgba(0,0,0,0.04);
  }
  .char-field input:focus { outline: none; border-color: var(--earth); }

  /* Dynamic check */
  .check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 12px 0; }
  .check-item {
    background: var(--panel2); border: 3px solid var(--wood-light);
    padding: 12px; display: flex; align-items: center; gap: 10px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
  }
  .check-item .ck-icon { font-size: 1.4rem; image-rendering: pixelated; }
  .check-item .ck-info { flex: 1; }
  .check-item .ck-name { font-weight: 600; font-size: 0.78rem; color: var(--wood-dark); }
  .check-item .ck-desc { font-size: 0.65rem; color: var(--muted); }
  .check-item select {
    border: 2px solid var(--wood); padding: 4px 6px;
    font-family: 'Press Start 2P', monospace; font-size: 0.35rem;
    background: #fefdf6; cursor: pointer; color: var(--text);
    image-rendering: pixelated;
  }
  .check-item select:focus { outline: none; border-color: var(--earth); }

  #dynamicsResult {
    margin-top: 12px; padding: 14px 16px; font-size: 0.78rem;
    background: var(--panel2); border: 3px solid var(--wood-light);
    box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
  }

  .diag-list { font-size: 0.78rem; line-height: 2.4; }
  .diag-list label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .diag-list input[type="checkbox"] {
    width: 14px; height: 14px; accent-color: var(--grass);
    cursor: pointer;
  }

  /* Buttons - like game UI */
  .btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 8px 16px; font-family: 'Press Start 2P', monospace;
    font-size: 0.4rem; cursor: pointer; transition: all 0.08s; font-weight: 400;
    border: 3px solid; text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
    box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
    image-rendering: pixelated;
  }
  .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(0,0,0,0.15); }
  .btn-primary {
    background: linear-gradient(180deg, var(--earth) 0%, #a04a2a 100%);
    color: #fff; border-color: var(--earth-dark);
  }
  .btn-primary:hover { background: linear-gradient(180deg, #d46d3d 0%, #b05a35 100%); }
  .btn-outline {
    background: linear-gradient(180deg, #f5edd8 0%, #e8dcc8 100%);
    color: var(--text); border-color: var(--wood);
  }
  .btn-outline:hover {
    background: linear-gradient(180deg, #fff3cd 0%, #ffe69c 100%);
    border-color: var(--earth);
  }
  .btn-sm { padding: 4px 8px; font-size: 0.33rem; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--wood-dark); color: #f5f0e8;
    padding: 10px 18px; font-size: 0.75rem; z-index: 999;
    opacity: 0; transform: translateY(10px); transition: all 0.15s;
    pointer-events: none; border: 3px solid var(--wood);
    box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
    font-family: 'Press Start 2P', monospace; font-size: 0.38rem;
    image-rendering: pixelated;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 12px; }
  ::-webkit-scrollbar-track { background: var(--wood-light); border-left: 2px solid var(--wood); }
  ::-webkit-scrollbar-thumb { background: var(--wood); border: 2px solid var(--wood-dark); }
  ::-webkit-scrollbar-thumb:hover { background: var(--earth); }

  /* Key event animation */
  @keyframes glow {
    0%, 100% { border-color: var(--accent2); }
    50% { border-color: #ff6b6b; }
  }
</style>
<link rel="stylesheet" href="assets/site-theme.css">
</head>

  <div style="display:flex;align-items:center;">
    <h1>故事织体</h1>
    <span class="subtitle">剧本素材选择填入框架</span>

<script>
// ===== DATA =====
const TAB_NAMES = ['三支柱', '七声部', '三幕布局', '路标时间线', '序列织体', '人物图谱', '动力检查'];

// Material database: keyed by context path
const MAT = {
  // 三支柱 - 主角类型
  heroType: [
    '菜鸟新人', '落魄老兵', '被误解者', '隐退高手', '孤儿/弃儿',
    '逃亡者', '双重身份者', '普通人在异常处境', '被选中者（抗拒）',
    '冒充者', '囚徒（字面或比喻）', '寄人篱下者', '背负原罪者', '失去记忆者'

function getStoryContext() {

  };

// Given a list of options, find which ones match user's upstream choices
function branchFilter(upstreamValue, branchKey) {
  if (!upstreamValue || !BRANCH[branchKey]) return [];
  const map = BRANCH[branchKey];
  for (const [key, suggestions] of Object.entries(map)) {
    if (upstreamValue.includes(key)) return suggestions;
  }
  return [];
}

function buildTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = TAB_NAMES.map((name, i) =>
    '<button type="button" class="tab' + (i === 0 ? ' active' : '') + '" data-idx="' + i + '" onclick="switchTab(' + i + ')">' + (i + 1) + '. ' + name + '</button>'

function switchTab(idx) {
  currentTab = idx;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const t = document.querySelector('.tab[data-idx="' + idx + '"]');
  if (t) t.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const p = document.getElementById('panel-' + idx);
  if (p) p.classList.add('active');
}

// ===== MATERIAL BAR COMPONENT =====
function matBar(fieldId, category, label) {
  const items = MAT[category] || [];
  if (!items.length) return '';
  const ctx = getStoryContext();
  let chips = items.map(item => '<span class="mat-chip" data-field="' + fieldId + '" data-val="' + escAttr(item) + '" onclick="insertMat(this)">' + item + '</span>').join('');

  // Branching: check if there are contextual suggestions
  let branchChips = '';
  if (category === 'identityStart' && ctx.heroType) {
    const suggestions = branchFilter(ctx.heroType, 'heroType_identityStart');
    if (suggestions.length) {
      branchChips = suggestions.map(s => '<span class="mat-chip selected" data-field="' + fieldId + '" data-val="' + escAttr(s) + '" onclick="insertMat(this)">🎯 ' + s + '</span>').join('');
    }
  }
  if (category === 'actionMode' && ctx.desireOpen) {
    const suggestions = branchFilter(ctx.desireOpen, 'desireType_actionMode');
    if (suggestions.length) {
      branchChips = suggestions.map(s => '<span class="mat-chip selected" data-field="' + fieldId + '" data-val="' + escAttr(s) + '" onclick="insertMat(this)">🎯 ' + s + '</span>').join('');
    }
  }
  if (category === 'obstacleType' && ctx.theme) {
    const suggestions = branchFilter(ctx.theme, 'themePair_obstacleType');
    if (suggestions.length) {
      branchChips = suggestions.map(s => '<span class="mat-chip selected" data-field="' + fieldId + '" data-val="' + escAttr(s) + '" onclick="insertMat(this)">🎯 ' + s + '</span>').join('');
    }
  }

  return '<div class="mat-bar"><span class="mat-label">' + (label || '素材') + '：</span>' + (branchChips || chips) + '</div>';
}

function escAttr(s) { return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function insertMat(chip) {
  const fieldId = chip.getAttribute('data-field');
  const val = chip.getAttribute('data-val');
  const input = document.getElementById(fieldId);
  if (input) {
    const current = input.value;
    input.value = current ? current + '；' + val : val;
    chip.classList.add('used');
    saveAll(); // 立刻存盘，再重建面板
    toast('已填入：' + val);
    setTimeout(refreshAffectedBars, 100);
  }
}

    else if (v.id === 'problem') { openCat = 'coreQuestion'; climaxCat = 'resultType'; }
    else if (v.id === 'obstacle') { openCat = 'obstacleType'; climaxCat = 'obstacleType'; }
    else if (v.id === 'result') { openCat = 'resultType'; climaxCat = 'resultType'; }
    else if (v.id === 'theme') { openCat = 'valueState'; climaxCat = 'valueState'; }

    rows += '<tr>' +
      '<td class="vl ' + v.cls + '">' + v.label + '</td>' +
      '<td><textarea id="v-open-' + v.id + '" oninput="onFieldInput()" placeholder="开篇时的' + v.label + '状态…" style="min-height:36px;"></textarea>' + matBar('v-open-' + v.id, openCat, '') + '</td>' +
      '<td style="text-align:center;color:var(--muted);width:30px;">→</td>' +
      '<td><textarea id="v-climax-' + v.id + '" oninput="onFieldInput()" placeholder="高潮时的' + v.label + '状态…" style="min-height:36px;"></textarea>' + matBar('v-climax-' + v.id, climaxCat, '') + '</td>' +
      '<td class="ci" id="contrast-' + v.id + '">—</td>' +
      '</tr>';
  });

  return '<div class="panel" id="panel-1">' +
    '<div class="section"><h2>七声部工作表</h2>' +
    '<div class="sec-desc">开篇状态与高潮状态必须形成<b>反差</b>。差距越大，故事空间越大。</div>' +
    '<table class="voice-table"><thead><tr><th style="width:55px;">声部</th><th>开篇事件状态</th><th style="width:30px;"></th><th>高潮事件状态</th><th style="width:55px;">反差</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div style="font-size:0.7rem;color:var(--muted);margin-top:8px;">🎯 = 带标记的素材是根据前面选项智能推荐的（分叉树逻辑）</div>' +
    '</div></div>';
}

// ===== PANEL 3: 路标时间线 =====
function buildPanel3() {
  let html = '<div class="panel" id="panel-3"><div class="section"><h2>十个路标事件 · 时间线</h2><div class="sec-desc">120分钟标准电影参照。红点为关键事件。</div><div class="timeline">';

  const beatHints = {
    1: '用一个强烈的画面/动作开篇', 2: '收束到主角的具体处境',
    3: '核心问题爆发——主角无法回头', 4: '第一次尝试，获得进展但发现更大困难',
    5: '局势根本性变化', 6: '被迫调整策略',
    7: '走到最低点', 8: '情绪和逻辑的最后蓄力',
    9: '终极对决', 10: '交待+延伸或转折'
  };

  roadMarkEvents.forEach(ev => {
    const cls = ev.key ? 'kp' : '';
    const badge = ev.key ? ' <span class="key-badge">关键</span>' : '';
    let cat = 'beatType';
    if (ev.id === 3) cat = 'incentivePattern';
    else if (ev.id === 5) cat = 'turnPattern';
    else if (ev.id === 7) cat = 'crisisPattern';
    else if (ev.id === 10) cat = 'endingType';

    html += '<div class="tl-ev ' + cls + '"><div class="tl-tm">' + ev.time + '</div><div class="tl-dot"></div>' +
      '<div class="tl-card"><div class="tl-nm">' + ev.id + '. ' + ev.name + badge + '</div>' +
      '<div class="tl-ds">' + ev.desc + '</div>' +
      '<div class="tl-tags">' + (ev.key ? '<span class="tl-tag" style="background:#fadbd8;">关键事件</span>' : '') + '<span class="tl-tag">' + beatHints[ev.id] + '</span></div>' +

      matBar('tl-' + ev.id, cat, '素材') +

}

function diagCheck(i, label) {

// ===== ONE SENTENCE =====
function updateOneSentence() {
  const hero = document.getElementById('pillar-hero')?.value?.trim() || '';
  const event = document.getElementById('pillar-event')?.value?.trim() || '';
  const theme = document.getElementById('pillar-theme')?.value?.trim() || '';
  const el = document.getElementById('oneSentenceText');
  if (!el) return;

  if (hero || event || theme) {
    el.className = '';
    el.textContent = (hero || '[主角]') + '因为[欲望/处境]，[动作]，面对' +
      (event || '[核心问题]') + '，遇到[主要障碍]，结果[结果]，表现了' +
      (theme || '[主题]') + '。';
  } else {
    el.className = 'placeholder';
    el.textContent = '填入三支柱后，一句话故事将自动生成……';
  }
}

// ===== DYNAMICS =====
function updateDynamics() {
  const scores = {
    identity: document.getElementById('check-identity')?.value || '',
    desire: document.getElementById('check-desire')?.value || '',
    action: document.getElementById('check-action')?.value || '',
    obstacle: document.getElementById('check-obstacle')?.value || ''
  };
  const values = { strong: 3, medium: 2, weak: 1 };
  let strongCount = 0, count = 0;
  Object.values(scores).forEach(v => { if (v) { if (v === 'strong') strongCount++; count++; } });

  const rd = document.getElementById('dynamicsResult');
  if (!rd) return;
  if (count === 0) { rd.innerHTML = '👆 请设置以上四项，查看动力评估结果。'; rd.style.background = 'var(--chip-bg)'; return; }

  if (strongCount >= 3) {
    rd.innerHTML = '✅ <b>动力极强</b> —— 满足' + strongCount + '项。张力充沛，注意控制节奏避免疲劳。';
    rd.style.background = '#d5f5e3';
  } else if (strongCount >= 2) {
    rd.innerHTML = '✅ <b>动力充足</b> —— 满足' + strongCount + '项。故事有良好推动力。';
    rd.style.background = '#d5f5e3';
  } else if (strongCount === 1) {
    rd.innerHTML = '⚠️ <b>动力不足</b> —— 仅1项。建议增强至少一个维度。';
    rd.style.background = '#fff3cd';
  } else {
    rd.innerHTML = '🔴 <b>动力严重不足</b> —— 故事可能平淡。加大开篇与高潮的反差。';
    rd.style.background = '#f8d7da';
  }
}

// ===== CONTRAST INDICATORS =====
function updateContrastIndicators() {
  ['identity', 'desire', 'action', 'problem', 'obstacle', 'result', 'theme'].forEach(v => {
    const openVal = document.getElementById('v-open-' + v)?.value?.trim() || '';
    const climaxVal = document.getElementById('v-climax-' + v)?.value?.trim() || '';
    const ind = document.getElementById('contrast-' + v);
    if (!ind) return;
    if (!openVal || !climaxVal) { ind.textContent = '—'; ind.style.color = '#c0b090'; }
    else if (openVal === climaxVal) { ind.textContent = '⚠ 无反'; ind.style.color = '#e74c3c'; }
    else { ind.textContent = '✓'; ind.style.color = '#2ecc71'; }
  });
}

// ===== CHARACTERS =====
function addCharacter() {
  characters.push({ id: Date.now(), name: '', role: '', identityStart: '', identityEnd: '', desireStart: '', desireEnd: '', actionMode: '', personality: '', ability: '', background: '' });
  buildPanels();
  loadAllData();
  switchTab(currentTab);
  toast('已添加新人物');
}

function updateChar(id, field, value) {
  const char = characters.find(c => c.id === id);
  if (char) { char[field] = value; autoSave(); }
}

function removeCharacter(id) {
  characters = characters.filter(c => c.id !== id);
  buildPanels();
  loadAllData();
  switchTab(currentTab);
  toast('已删除人物');
}

// ===== PERSISTENCE =====
const SK = 'story-weaver-v2';

function onFieldInput() {
  clearTimeout(window._saveTimer);
  window._saveTimer = setTimeout(() => { saveAll(); updateOneSentence(); updateContrastIndicators(); }, 400);
}

function collectData() {
  const d = { voices: {}, acts: {}, timeline: {}, sequences: {}, dynamics: {}, diagnosis: {} };

  d.pillarHero = document.getElementById('pillar-hero')?.value || '';
  d.pillarEvent = document.getElementById('pillar-event')?.value || '';
  d.pillarTheme = document.getElementById('pillar-theme')?.value || '';

  ['identity','desire','action','problem','obstacle','result','theme'].forEach(v => {
    d.voices['open-' + v] = document.getElementById('v-open-' + v)?.value || '';
    d.voices['climax-' + v] = document.getElementById('v-climax-' + v)?.value || '';
  });

  ['incentive','turn','crisis'].forEach(a => {
    d.acts[a] = document.getElementById('act-' + a)?.value || '';
  });
  ['act1','act2a','act2b','act3'].forEach(a => {
    const el = document.getElementById(a + '-story');
    if (el) d.acts[a + 'Story'] = el.value;
  });

  roadMarkEvents.forEach(ev => {
    const el = document.getElementById('tl-' + ev.id);
    if (el) d.timeline[ev.id] = el.value;
  });

  sequenceData.forEach(seq => {
    const el = document.getElementById('seq-' + seq.id);
    if (el) d.sequences[seq.id] = el.value;
  });

  d.characters = characters;

  ['identity','desire','action','obstacle'].forEach(k => {
    const el = document.getElementById('check-' + k);
    if (el) d.dynamics[k] = el.value;
  });

  for (let i = 1; i <= 13; i++) {
    const el = document.getElementById('diag-c' + i);
    if (el) d.diagnosis['c' + i] = el.checked;
  }

  return d;
}

function saveAll() {
  localStorage.setItem(SK, JSON.stringify(collectData()));
}

function autoSave() { saveAll(); }

function loadAllData() {
  const raw = localStorage.getItem(SK);
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    const setVal = (id, val) => { if (val !== undefined && val !== null) { const el = document.getElementById(id); if (el) el.value = val; } };

    setVal('pillar-hero', d.pillarHero);
    setVal('pillar-event', d.pillarEvent);
    setVal('pillar-theme', d.pillarTheme);

    if (d.voices) Object.entries(d.voices).forEach(([k, v]) => setVal('v-' + k, v));
    if (d.acts) Object.entries(d.acts).forEach(([k, v]) => {
      if (['incentive','turn','crisis'].includes(k)) setVal('act-' + k, v);
      else setVal(k, v); // act1Story -> act1-story ... no, key is act1Story and id is act1-story
    });
    // Fix act story keys
    if (d.acts) {
      setVal('act1-story', d.acts.act1Story);
      setVal('act2a-story', d.acts.act2aStory);
      setVal('act2b-story', d.acts.act2bStory);
      setVal('act3-story', d.acts.act3Story);
    }
    if (d.timeline) Object.entries(d.timeline).forEach(([k, v]) => setVal('tl-' + k, v));
    if (d.sequences) Object.entries(d.sequences).forEach(([k, v]) => setVal('seq-' + k, v));

    if (d.characters && Array.isArray(d.characters)) characters = d.characters;

    if (d.dynamics) Object.entries(d.dynamics).forEach(([k, v]) => { const el = document.getElementById('check-' + k); if (el) el.value = v; });
    if (d.diagnosis) Object.entries(d.diagnosis).forEach(([k, v]) => { const el = document.getElementById('diag-' + k); if (el) el.checked = v; });

    updateOneSentence();
    updateContrastIndicators();
    updateDynamics();
  } catch (e) { console.error('加载失败:', e); }
}

function resetAll() {
  if (!confirm('确定要清空所有已填入的内容吗？此操作不可恢复。')) return;
  document.querySelectorAll('textarea, input[type="text"]').forEach(el => { if (el.id) el.value = ''; });
  document.querySelectorAll('select').forEach(el => { el.value = ''; });
  document.querySelectorAll('input[type="checkbox"]').forEach(el => { el.checked = false; });
  characters = [];
  localStorage.removeItem(SK);
  buildPanels();
  switchTab(0);
  updateOneSentence();
  updateDynamics();
  toast('已清空全部内容');
}

function exportAll() {
  const d = collectData();
  let t = '════════════════════\n  故事织体 · 导出\n  时间：' + new Date().toLocaleString() + '\n════════════════════\n\n';
  t += '【三支柱】\n主角：' + (d.pillarHero || '未填') + '\n主事件：' + (d.pillarEvent || '未填') + '\n主题：' + (d.pillarTheme || '未填') + '\n\n';
  t += '【七声部】\n';
  const vn = { identity:'身份',desire:'欲望',action:'动作',problem:'核心问题',obstacle:'主要障碍',result:'结果',theme:'主题' };
  Object.entries(vn).forEach(([k,n]) => { t += n + '：开篇[' + (d.voices['open-'+k]||'') + '] → 高潮[' + (d.voices['climax-'+k]||'') + ']\n'; });
  t += '\n【三幕】\n激励：' + (d.acts.incentive||'') + '\n转折：' + (d.acts.turn||'') + '\n危机：' + (d.acts.crisis||'') + '\n';
  t += '\n【路标事件】\n';
  roadMarkEvents.forEach(ev => { t += ev.id + '. ' + ev.name + '（' + ev.time + '）：' + (d.timeline[ev.id]||'') + '\n'; });
  t += '\n【序列织体】\n';
  sequenceData.forEach(seq => { t += seq.id + '. ' + seq.name + '：' + (d.sequences[seq.id]||'') + '\n'; });
  t += '\n【人物】\n';
  characters.forEach((c,i) => { t += '\n人物'+(i+1)+'：'+(c.name||'未命名')+'（'+(c.role||'?')+'）\n  身份：'+(c.identityStart||'?')+' → '+(c.identityEnd||'?')+'\n  欲望：'+(c.desireStart||'?')+' → '+(c.desireEnd||'?')+'\n  动作：'+(c.actionMode||'?')+' | 性格：'+(c.personality||'?')+'\n  能力：'+(c.ability||'?')+' | 背景：'+(c.background||'?')+'\n'; });
  t += '\n【动力检查】\n身份难：'+d.dynamics.identity+' | 欲望强：'+d.dynamics.desire+' | 动作反：'+d.dynamics.action+' | 障碍大：'+d.dynamics.obstacle+'\n';

  const blob = new Blob([t], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '故事织体_' + new Date().toISOString().slice(0,10) + '.txt';
  a.click(); URL.revokeObjectURL(url);
  toast('导出完成！');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

// ===== KEYBOARD =====
document.addEventListener('keydown', function(e) {
  if (e.metaKey || e.ctrlKey) {
    if (e.key === 's') { e.preventDefault(); saveAll(); toast('已保存'); }
    if (e.key >= '1' && e.key <= '7') { e.preventDefault(); switchTab(parseInt(e.key) - 1); }
  }
});

// ===== STARTUP =====
(function() {
  try {
    buildAll();
    loadAllData();
    updateOneSentence();
    updateDynamics();
    console.log('故事织体 v2 已就绪');
  } catch (e) {
    console.error('初始化失败:', e);
    alert('初始化失败: ' + e.message);
  }
})();
