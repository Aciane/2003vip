<!DOCTYPE html>
<html lang="zh-CN" data-theme="immersive">
<head><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>好莱坞电影装置实验</title>
    <style>
        :root {
            --accent: #fff;
            --theater-bg: #030303;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--theater-bg);
            color: #666;
            font-family: "Times New Roman", serif;
            overflow: hidden;
            display: flex;
        }

        /* 档案导航 */
        #archive-panel {
            width: 280px;
            height: 100vh;
            background: rgba(10, 10, 10, 0.9);
            border-right: 1px solid #222;
            padding: 20px;
            z-index: 100;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .archive-header {
            font-size: 14px;
            color: #aaa;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .genre-btn {
            background: none;
            border: 1px solid #222;
            color: #555;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }

        .genre-btn:hover {
            border-color: #555;
            color: #eee;
        }

        .genre-btn.active {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--accent);
            color: #fff;
        }

        .stat-box {
            margin-top: auto;
            font-size: 11px;
            color: #444;
            line-height: 1.6;
        }

        /* 画布区域 */
        #stage {
            flex-grow: 1;
            position: relative;
        }

        canvas {
            display: block;
        }

        /* 聚焦光锥效果 */
        #projector-light {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 1px; height: 1px;
            box-shadow: 0 0 150px 80px rgba(255, 255, 255, 0.05);
            pointer-events: none;
            z-index: 5;
        }
    </style>
<link rel="stylesheet" href="assets/site-theme.css">
</head>
<body class="site-page"><nav class="site-path" aria-label="站点导航"><a href="index.html">唐择镇 / 感知漫游</a><span>交互实验</span><a href="index.html#archive">文章目录 ↗</a></nav>

<div id="archive-panel">
    <div class="archive-header">CLASSIC HOLLYWOOD ARCHIVE</div>
    <button class="genre-btn" onclick="setGenre('musical')" id="btn-musical">MUSICAL / 歌舞片：轻盈与足尖</button>
    <button class="genre-btn" onclick="setGenre('western')" id="btn-western">WESTERN / 西部片：粗粝与皮革</button>
    <button class="genre-btn" onclick="setGenre('melodrama')" id="btn-melodrama">MELODRAMA / 情节剧：液体与呜咽</button>
    <button class="genre-btn" onclick="setGenre('noir')" id="btn-noir">FILM NOIR / 黑色：剪影与烟雾</button>
    <button class="genre-btn" onclick="setGenre('gangster')" id="btn-gangster">GANGSTER / 黑帮：铁拳与肌理</button>
    <button class="genre-btn" onclick="setGenre('screwball')" id="btn-screwball">SCREWBALL / 神经喜剧：碰撞与痉挛</button>
    <button class="genre-btn" onclick="setGenre('horror')" id="btn-horror">HORROR / 恐怖：惊跳与收缩</button>
    <button class="genre-btn" onclick="setGenre('epic')" id="btn-epic">EPIC / 史诗：青铜与重压</button>

    <div class="stat-box">
        <strong>装置笔记：</strong><br>
        1930年代，好莱坞每周吸引 8000 万人次观影。电影院是一个集体潜意识的实验室。光锥投射出解构后的身体器官，观众在黑暗中完成感官重建。
    </div>
</div>

<div id="stage">
    <div id="projector-light"></div>
    <canvas id="canvas"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height;
let particles = [];
let audience = [];
let currentGenre = 'musical';

const genres = {
    musical: {
        body: ['🩰', '💃', '👣', '🧤', '🎵', '✨'],
        colors: ['#fffacd', '#ff69b4', '#87ceeb'],
        logic: 'float',
        filter: 'sepia(0.2) brightness(1.2)',
        desc: '重心上移，身体失去重力，唯余旋转的裙摆与敲击的足尖。'
    },
    western: {
        body: ['🌵', '👢', '💪', '🏇', '🏜️', '🐂'],
        colors: ['#8b4513', '#d2b48c', '#556b2f'],
        logic: 'heavy',
        filter: 'contrast(1.5) saturate(0.5)',
        desc: '干裂的皮肤，皮革的摩擦，汗水混合着尘埃。'
    },
    melodrama: {
        body: ['💧', '👁️', '💔', '🧤', '🥀', '🌊'],
        colors: ['#add8e6', '#f08080', '#ffffff'],
        logic: 'fluid',
        filter: 'blur(0.5px) opacity(0.8)',
        desc: '过剩的液体（泪水），过度扩张的胸膛，无法承受的情感溢出。'
    },
    noir: {
        body: ['🚬', '🕶️', '👣', '🧤', '🔫', '🌑'],
        colors: ['#ffffff', '#444444', '#000000'],
        logic: 'shadow',
        filter: 'grayscale(1) contrast(2)',
        desc: '身体被阴影切割，只有指尖的香烟烟雾是真实存在的。'
    },
    gangster: {
        body: ['👊', '🦷', '🧥', '💼', '🩸', '🧱'],
        colors: ['#2f4f4f', '#800000', '#1a1a1a'],
        logic: 'impact',
        filter: 'brightness(0.8) contrast(1.2)',
        desc: '紧握的拳头，坚硬的下颚线，疤痕与布料的硬度。'
    },
    screwball: {
        body: ['🤪', '🎩', '👠', '🔔', '🍳', '🌪️'],
        colors: ['#ffefd5', '#ff4500', '#00ced1'],
        logic: 'bounce',
        filter: 'saturate(1.8)',
        desc: '失控的四肢，语言的快速对撞引发的肌肉抽搐。'
    },
    horror: {
        body: ['💀', '👀', '🖐️', '🔪', '⛓️', '🩸'],
        colors: ['#000000', '#ff0000', '#7fff00'],
        logic: 'spasm',
        filter: 'invert(0.1) hue-rotate(90deg)',
        desc: '皮肤的退缩，瞳孔的极度收缩，痉挛的末梢。'
    },
    epic: {
        body: ['🏛️', '🛡️', '🔱', '🐎', '☀️', '🗿'],
        colors: ['#ffd700', '#cd7f32', '#f5f5dc'],
        logic: 'static',
        filter: 'sepia(0.5) brightness(1.1)',
        desc: '青铜色的肌肉，大理石般的沉重，神话式的身体尺度。'
    }
};

class Particle {
    constructor() {
        this.init();
    }

    init() {
        const config = genres[currentGenre];
        // 聚焦投射：出生点在中心光束内
        this.x = width / 2 + (Math.random() - 0.5) * 80;
        this.y = 100;
        
        // 散射角度
        let angle = Math.PI / 2 + (Math.random() - 0.5) * 0.8;
        let force = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * force;
        this.vy = Math.sin(angle) * force;
        
        this.char = config.body[Math.floor(Math.random() * config.body.length)];
        this.color = config.colors[Math.floor(Math.random() * config.colors.length)];
        this.size = 10;
        this.opacity = 0;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.1;
    }

    update() {
        const config = genres[currentGenre];
        
        // 不同类型的物理性逻辑
        if (config.logic === 'float') { this.vy *= 0.98; this.vx *= 0.99; }
        if (config.logic === 'heavy') { this.vy += 0.25; }
        if (config.logic === 'fluid') { this.vx += Math.sin(this.y/50)*0.5; this.vy *= 0.99; }
        if (config.logic === 'spasm') { this.vx += (Math.random()-0.5)*4; this.vy += 0.1; }
        if (config.logic === 'bounce') { if(this.y > height-150) this.vy *= -0.8; this.vy += 0.2; }
        if (config.logic === 'static') { this.vy = 1; this.vx *= 0.95; this.size += 0.2; }

        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.rotSpeed;
        
        // 越靠近观众（屏幕下方）越大，模拟投射感
        this.size = 10 + (this.y / height) * 50;
        if (this.opacity < 1) this.opacity += 0.05;

        if (this.y > height || this.x < 0 || this.x > width) this.init();
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.font = `${this.size}px serif`;
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.fillText(this.char, 0, 0);
        ctx.restore();
    }
}

class Audience {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.blink = 0;
        this.nextBlink = Math.random() * 3000;
    }
    update() {
        if (Date.now() % 4000 < 100) this.blink = 1;
        else this.blink = 0;
    }
    draw() {
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, 10, 5, 0, 0, Math.PI*2);
        ctx.fill();
        if (!this.blink) {
            ctx.fillStyle = genres[currentGenre].colors[0];
            ctx.beginPath();
            // 眼神聚焦在屏幕中心投射区
            let dx = (width/2 - this.x) * 0.01;
            ctx.arc(this.x + dx, this.y, 2, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

function setGenre(g) {
    currentGenre = g;
    document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-${g}`).classList.add('active');
    
    // 视觉滤镜
    canvas.style.filter = genres[g].filter;
    document.documentElement.style.setProperty('--accent', genres[g].colors[0]);
    
    particles = [];
    for(let i=0; i<100; i++) particles.push(new Particle());
}

function resize() {
    width = canvas.width = window.innerWidth - 280;
    height = canvas.height = window.innerHeight;
    
    audience = [];
    for(let i=0; i<width; i+=40) {
        for(let j=0; j<3; j++) {
            audience.push(new Audience(i + Math.random()*20, height - 80 + j*25));
        }
    }
}

function animate() {
    ctx.fillStyle = 'rgba(3,3,3,0.2)';
    ctx.fillRect(0,0,width,height);

    particles.forEach(p => { p.update(); p.draw(); });
    audience.forEach(a => { a.update(); a.draw(); });

    // 绘制聚焦的光锥线
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.beginPath();
    ctx.moveTo(width/2, 0);
    ctx.lineTo(width/2 - 200, height);
    ctx.moveTo(width/2, 0);
    ctx.lineTo(width/2 + 200, height);
    ctx.stroke();

    requestAnimationFrame(animate);
}

window.onresize = resize;
resize();
setGenre('musical');
animate();

</script>
</body>
</html>
