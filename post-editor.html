<!DOCTYPE html>
<html lang="zh-CN" data-theme="tool">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST EDITOR / 文章编辑器</title>
    <style>
        :root {
            --bg:     #09090d;
            --panel:  #111117;
            --raised: #16161d;
            --border: #1e1e28;
            --red:    #ff3b30;
            --text:   #d4d4da;
            --dim:    #484854;
            --input:  #0d0d12;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace, "PingFang SC", sans-serif;
            font-size: 13px;
        }

        /* ─── TOP BAR ─────────────────────────────────── */
        .topbar {
            height: 46px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .topbar-logo {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--red);
        }

        .topbar-actions { display: flex; gap: 7px; }

        .btn {
            padding: 5px 13px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: opacity .15s;
        }
        .btn:hover { opacity: .7; }
        .btn-red     { background: var(--red); color: #fff; }
        .btn-outline { background: transparent; color: var(--red); border: 1px solid var(--red); }
        .btn-ghost   { background: transparent; color: var(--dim); border: 1px solid var(--border); }
        .btn-ghost:hover { color: var(--text); }

        /* ─── LAYOUT ───────────────────────────────────── */
        .layout {
            display: flex;
            height: calc(100vh - 46px);
        }

        /* ─── LEFT / INPUT PANEL ───────────────────────── */
        .input-panel {
            width: 380px;
            min-width: 280px;
            flex-shrink: 0;
            background: var(--panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .input-panel::-webkit-scrollbar { width: 5px; }
        .input-panel::-webkit-scrollbar-thumb { background: var(--border); }

        .sec { padding: 14px 16px 4px; }
        .sec + .sec { padding-top: 8px; }

        .sec-head {
            font-size: 8.5px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--red);
            padding-bottom: 9px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sec-head-num {
            background: var(--red);
            color: #fff;
            width: 16px;
            height: 16px;
            font-size: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .field { margin-bottom: 11px; }

        .field-label {
            font-size: 8.5px;
            color: var(--dim);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .field input,
        .field textarea {
            width: 100%;
            background: var(--input);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 7px 9px;
            font-size: 12px;
            font-family: inherit;
            outline: none;
            transition: border-color .18s;
            resize: vertical;
        }

        .field input:focus,
        .field textarea:focus { border-color: rgba(255,59,48,.45); }
        .field textarea { min-height: 66px; line-height: 1.65; }

        /* ─── BLOCKS SECTION ───────────────────────────── */
        .blocks-wrap {
            padding: 0 16px 16px;
            flex: 1;
        }

        .block-item {
            border: 1px solid var(--border);
            margin-bottom: 7px;
            background: var(--input);
        }

        .block-bar {
            display: flex;
            align-items: center;
            padding: 5px 8px;
            border-bottom: 1px solid var(--border);
            gap: 6px;
            background: var(--raised);
        }

        .block-type-sel {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--red);
            padding: 2px 5px;
            font-size: 8.5px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }

        .block-idx {
            font-size: 8.5px;
            color: var(--dim);
            flex: 1;
        }

        .block-ctrl { display: flex; gap: 3px; }

        .ico-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--dim);
            width: 20px;
            height: 20px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            transition: all .15s;
        }
        .ico-btn:hover { color: var(--red); border-color: rgba(255,59,48,.4); }

        .block-body { padding: 8px; }

        .block-body textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 12px;
            font-family: inherit;
            resize: vertical;
            min-height: 50px;
            max-height: 240px;
            outline: none;
            line-height: 1.65;
        }

        .block-hint {
            font-size: 8px;
            color: var(--dim);
            padding: 0 8px 6px;
            opacity: .6;
        }

        .add-block-btn {
            width: 100%;
            padding: 9px;
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--dim);
            font-size: 8.5px;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: inherit;
            margin-top: 5px;
            transition: all .2s;
        }
        .add-block-btn:hover { border-color: var(--red); color: var(--red); }

        /* ─── PREVIEW PANEL ────────────────────────────── */
        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0c0c10;
        }

        .preview-bar {
            height: 33px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 8px;
            flex-shrink: 0;
        }

        .preview-dot {
            width: 5px;
            height: 5px;
            background: var(--red);
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

        .preview-bar-label {
            font-size: 8.5px;
            letter-spacing: 2px;
            color: var(--dim);
        }

        .preview-bar-label span {
            color: var(--red);
            margin-left: 6px;
        }

        #previewFrame {
            width: 100%;
            flex: 1;
            border: none;
        }

        /* ─── RESIZE HANDLE ────────────────────────────── */
        .resize-handle {
            width: 4px;
            background: var(--border);
            cursor: col-resize;
            flex-shrink: 0;
            transition: background .15s;
            position: relative;
            z-index: 5;
        }
        .resize-handle:hover,
        .resize-handle.dragging { background: rgba(255,59,48,.4); }

        /* ─── TOAST ────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--raised);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 11px;
            padding: 8px 18px;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity .25s, transform .25s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
<link rel="stylesheet" href="assets/site-theme.css">
</head>
<body class="site-page">

<!-- TOP BAR -->
<div class="topbar">
    <div class="topbar-logo">POST EDITOR / 文章编辑器</div>
    <div class="topbar-actions">
        <button class="btn btn-ghost" onclick="resetAll()">RESET</button>
        <button class="btn btn-outline" id="copyBtn" onclick="copyHTML()">COPY HTML</button>
        <button class="btn btn-red" onclick="exportHTML()">&#8595; EXPORT</button>
    </div>
</div>

<!-- MAIN LAYOUT -->
<div class="layout">

    <!-- ═══════════ INPUT PANEL ═══════════ -->
    <div class="input-panel" id="inputPanel">

        <!-- 01 METADATA -->
        <div class="sec">
            <div class="sec-head"><span class="sec-head-num">1</span>METADATA / 元信息</div>
            <div class="field">
                <div class="field-label">TITLE / 标题 *</div>
                <input type="text" id="f-title" placeholder="文章主标题..." oninput="debounce()">
            </div>
            <div class="field">
                <div class="field-label">SUBTITLE / 副标题（可选）</div>
                <input type="text" id="f-subtitle" placeholder="副标题..." oninput="debounce()">
            </div>
            <div class="field">
                <div class="field-label">AUTHOR / 作者</div>
                <input type="text" id="f-author" value="TANG ZE ZHEN" oninput="debounce()">
            </div>
            <div class="field">
                <div class="field-label">DATE / 日期</div>
                <input type="text" id="f-date" placeholder="YYYY.MM.DD" oninput="debounce()">
            </div>
        </div>

        <!-- 02 ABSTRACT -->
        <div class="sec">
            <div class="sec-head"><span class="sec-head-num">2</span>ABSTRACT / 摘要</div>
            <div class="field">
                <div class="field-label">ABSTRACT / 摘要正文</div>
                <textarea id="f-abstract" placeholder="摘要内容（可选）..." oninput="debounce()"></textarea>
            </div>
            <div class="field">
                <div class="field-label">KEYWORDS / 关键词</div>
                <input type="text" id="f-keywords" placeholder="关键词A；关键词B" oninput="debounce()">
            </div>
        </div>

        <!-- 03 CONTENT -->
        <div class="sec" style="padding-bottom:0">
            <div class="sec-head"><span class="sec-head-num">3</span>CONTENT BLOCKS / 内容块</div>
        </div>
        <div class="blocks-wrap">
            <div id="blockList"></div>
            <button class="add-block-btn" onclick="addBlock()">＋ ADD BLOCK / 添加内容块</button>
        </div>

        <!-- 04 FOOTER -->
        <div class="sec">
            <div class="sec-head"><span class="sec-head-num">4</span>FOOTER / 页脚</div>
            <div class="field">
                <div class="field-label">PREV TEXT / 上一篇标题</div>
                <input type="text" id="f-prev-text" placeholder="上一篇文章名..." oninput="debounce()">
            </div>
            <div class="field">
                <div class="field-label">PREV URL</div>
                <input type="text" id="f-prev-url" value="#" oninput="debounce()">
            </div>
            <div class="field">
                <div class="field-label">NEXT TEXT / 下一篇标题</div>
                <input type="text" id="f-next-text" placeholder="下一篇文章名..." oninput="debounce()">
            </div>
            <div class="field">
                <div class="field-label">NEXT URL</div>
                <input type="text" id="f-next-url" value="#" oninput="debounce()">
            </div>
            <div class="field" style="margin-bottom:16px">
                <div class="field-label">FOOTER TAG / 结尾标记</div>
                <input type="text" id="f-footer-tag" value="END OF DOCUMENT / NODE_01_SUCCESS" oninput="debounce()">
            </div>
        </div>

    </div>

    <!-- RESIZE HANDLE -->
    <div class="resize-handle" id="resizeHandle"></div>

    <!-- ═══════════ PREVIEW PANEL ═══════════ -->
    <div class="preview-panel">
        <div class="preview-bar">
            <div class="preview-dot"></div>
            <div class="preview-bar-label">LIVE PREVIEW<span id="previewStatus"></span></div>
        </div>
        <iframe id="previewFrame" title="preview"></iframe>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let blocks = [];
let nextId  = 0;
let timer   = null;

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
(function init() {
    const now = new Date();
    document.getElementById('f-date').value =
        now.getFullYear() + '.' +
        String(now.getMonth() + 1).padStart(2, '0') + '.' +
        String(now.getDate()).padStart(2, '0');

    addBlock('h2', '一、 标题');
    addBlock('p',  '在这里写正文段落...');
    addBlock('h2', '二、 标题');
    addBlock('p',  '');

    updatePreview();
    initResize();
})();

// ═══════════════════════════════════════════════
//  BLOCK MANAGEMENT
// ═══════════════════════════════════════════════
function addBlock(type = 'p', content = '') {
    blocks.push({ id: nextId++, type, content });
    renderBlocks();
    debounce();
}

function removeBlock(id) {
    blocks = blocks.filter(b => b.id !== id);
    renderBlocks();
    debounce();
}

function moveBlock(id, dir) {
    const i = blocks.findIndex(b => b.id === id);
    if (dir === 'up'   && i > 0)              [blocks[i], blocks[i-1]] = [blocks[i-1], blocks[i]];
    if (dir === 'down' && i < blocks.length-1)[blocks[i], blocks[i+1]] = [blocks[i+1], blocks[i]];
    renderBlocks();
    debounce();
}

function setType(id, type) {
    const b = blocks.find(b => b.id === id);
    if (b) b.type = type;
    renderBlocks();
    debounce();
}

function setContent(id, val) {
    const b = blocks.find(b => b.id === id);
    if (b) b.content = val;
    debounce();
}

function renderBlocks() {
    const list = document.getElementById('blockList');
    const ph = { h2: 'H2 标题 / Section Title…', h3: 'H3 小标题 / Subsection…', p: '段落正文… (可使用 HTML 标签)' };
    const icon = { h2: 'H2', h3: 'H3', p: '¶' };

    list.innerHTML = '';
    blocks.forEach((b, i) => {
        const el = document.createElement('div');
        el.className = 'block-item';
        el.innerHTML =
            '<div class="block-bar">' +
                '<select class="block-type-sel" onchange="setType(' + b.id + ',this.value)">' +
                    '<option value="p"  ' + (b.type==='p'  ? 'selected':'') + '>¶  PARAGRAPH</option>' +
                    '<option value="h2" ' + (b.type==='h2' ? 'selected':'') + '>H2 SECTION</option>' +
                    '<option value="h3" ' + (b.type==='h3' ? 'selected':'') + '>H3 SUBSECTION</option>' +
                '</select>' +
                '<span class="block-idx">#' + (i+1) + '</span>' +
                '<div class="block-ctrl">' +
                    '<button class="ico-btn" onclick="moveBlock(' + b.id + ',\'up\')"   title="上移">↑</button>' +
                    '<button class="ico-btn" onclick="moveBlock(' + b.id + ',\'down\')" title="下移">↓</button>' +
                    '<button class="ico-btn" onclick="removeBlock(' + b.id + ')" title="删除" style="color:var(--red)">✕</button>' +
                '</div>' +
            '</div>' +
            '<div class="block-body">' +
                '<textarea placeholder="' + ph[b.type] + '" oninput="setContent(' + b.id + ',this.value)">' +
                    escAttr(b.content) +
                '</textarea>' +
            '</div>' +
            (b.type === 'p' ? '<div class="block-hint">支持 HTML 标签，如 &lt;strong&gt;加粗&lt;/strong&gt;</div>' : '');
        list.appendChild(el);
    });
}

// ═══════════════════════════════════════════════
//  PREVIEW
// ═══════════════════════════════════════════════
function debounce() {
    clearTimeout(timer);
    timer = setTimeout(updatePreview, 180);
}

function get(id) { return document.getElementById(id).value; }

function updatePreview() {
    document.getElementById('previewStatus').textContent = ' — UPDATING…';
    document.getElementById('previewFrame').srcdoc = buildHTML();
    setTimeout(() => {
        document.getElementById('previewStatus').textContent = '';
    }, 400);
}

// ═══════════════════════════════════════════════
//  HTML BUILDER
// ═══════════════════════════════════════════════
function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildBodyHTML() {
    return blocks.map(b => {
        // content blocks allow raw HTML; just convert bare newlines to <br>
        const c = (b.content || '').replace(/\n/g, '<br>');
        if (b.type === 'h2') return '\n            <h2>' + c + '</h2>';
        if (b.type === 'h3') return '\n            <h3>' + c + '</h3>';
        return '\n            <p>' + c + '</p>';
    }).join('');
}

function buildHTML() {
    const title      = get('f-title');
    const subtitle   = get('f-subtitle');
    const author     = get('f-author');
    const date       = get('f-date');
    const abstract   = get('f-abstract');
    const keywords   = get('f-keywords');
    const prevText   = get('f-prev-text');
    const prevUrl    = get('f-prev-url')  || '#';
    const nextText   = get('f-next-text');
    const nextUrl    = get('f-next-url')  || '#';
    const footerTag  = get('f-footer-tag');

    const bodyHTML = buildBodyHTML();

    const subtitleHTML = subtitle
        ? '<div class="article-subtitle">' + esc(subtitle) + '</div>'
        : '';

    const abstractHTML = abstract
        ? '<section class="abstract-box">\n' +
          '            <span class="abstract-label">摘要 / ABSTRACT</span>\n' +
          '            ' + abstract.replace(/\n/g,'<br>') +
          (keywords ? '\n            <br><strong>关键词：</strong>' + keywords : '') +
          '\n        </section>'
        : '';

    // Inner script for generated HTML (no template literals to avoid nesting issues)
    const innerJS = [
        "var poster=document.getElementById('poster');",
        "var tx=0,ty=0,cx=0,cy=0;",
        "if(window.innerWidth>1024){",
        "  window.addEventListener('mousemove',function(e){",
        "    tx=(e.clientX/window.innerWidth-0.5)*15;",
        "    ty=(e.clientY/window.innerHeight-0.5)*15;",
        "  });",
        "}",
        "function raf(){",
        "  cx+=(tx-cx)*0.1; cy+=(ty-cy)*0.1;",
        "  poster.style.transform='rotateY('+cx+'deg) rotateX('+(-cy)+'deg)';",
        "  requestAnimationFrame(raf);",
        "}",
        "raf();",
        "setInterval(function(){",
        "  var n=new Date();",
        "  document.getElementById('time-code').textContent=",
        "    n.toLocaleTimeString('en-GB')+':'+('0'+Math.floor(n.getMilliseconds()/10)).slice(-2);",
        "},40);",
        "var pc=document.getElementById('particles');",
        "for(var i=0;i<40;i++){",
        "  var d=document.createElement('div');",
        "  d.className='dot';",
        "  var s=Math.random()*2;",
        "  d.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;--z:'+(Math.random()*1000-500)+'px;--duration:'+(2+Math.random()*3)+'s;';",
        "  pc.appendChild(d);",
        "}"
    ].join('\n');

    const documentHTML = '<!DOCTYPE html>\n' +
'<html lang="zh-CN">\n' +
'<head>\n' +
'    <meta charset="UTF-8">\n' +
'    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
'    <title>' + esc(title || '未命名文章') + '</title>\n' +
'    <style>\n' +
'        :root {\n' +
'            --paper-white: #f5f5f7;\n' +
'            --accent-red: #ff3b30;\n' +
'            --text-main: #1d1d1f;\n' +
'            --text-dim: #86868b;\n' +
'            --bg-dark: #0a0b10;\n' +
'        }\n' +
'        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n' +
'        body {\n' +
'            background-color: var(--bg-dark);\n' +
'            color: var(--text-main);\n' +
'            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;\n' +
'            line-height: 1.8;\n' +
'            overflow-x: hidden;\n' +
'        }\n' +
'        .particles { position: fixed; width: 100%; height: 100%; pointer-events: none; z-index: 0; }\n' +
'        .dot { position: absolute; background: white; border-radius: 50%; opacity: 0.2; animation: twinkle var(--duration) infinite ease-in-out; }\n' +
'        @keyframes twinkle { 0%, 100% { opacity: 0.1; transform: scale(0.8); } 50% { opacity: 0.6; transform: scale(1.2); } }\n' +
'        .top-nav {\n' +
'            position: fixed; top: 0; width: 100%; z-index: 100;\n' +
'            background: rgba(245, 245, 247, 0.85);\n' +
'            backdrop-filter: blur(20px);\n' +
'            -webkit-backdrop-filter: blur(20px);\n' +
'            border-bottom: 1px solid rgba(0,0,0,0.07);\n' +
'            padding: 10px 20px;\n' +
'            display: flex; justify-content: space-between; align-items: center;\n' +
'        }\n' +
'        .back-link { font-size: 12px; font-weight: 800; color: var(--accent-red); text-decoration: none; letter-spacing: 1px; }\n' +
'        .nav-info { font-size: 10px; color: var(--text-dim); font-family: monospace; }\n' +
'        .main-container {\n' +
'            position: relative; z-index: 10;\n' +
'            margin: 80px auto 40px;\n' +
'            width: 92%; max-width: 800px;\n' +
'            background: var(--paper-white);\n' +
'            box-shadow: 0 40px 100px rgba(0,0,0,0.5);\n' +
'            padding: 40px 30px;\n' +
'            min-height: 100vh;\n' +
'            transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1);\n' +
'        }\n' +
'        @media (max-width: 600px) {\n' +
'            .main-container { width: 100%; margin: 60px 0 0; padding: 30px 20px; box-shadow: none; }\n' +
'            .article-title  { font-size: 24px !important; }\n' +
'        }\n' +
'        .article-header { border-bottom: 2px solid var(--accent-red); padding-bottom: 20px; margin-bottom: 30px; }\n' +
'        .article-title  { font-size: 28px; font-weight: 900; line-height: 1.3; margin-bottom: 10px; color: #000; }\n' +

'</html>';
    const theme = [...document.styleSheets].find(sheet => sheet.href && sheet.href.split('?')[0].endsWith('/assets/site-theme.css'));
    const css = theme ? [...theme.cssRules].map(rule => rule.cssText).join('\n') : '';
    return documentHTML
        .replace('<html ', '<html data-theme="essay" ')
        .replace('<body>', '<body class="site-page">')
        .replace('</head>', '<style>' + css + '</style></head>');

}

// ═══════════════════════════════════════════════
//  EXPORT & COPY
// ═══════════════════════════════════════════════
function exportHTML() {
    const title = get('f-title') || 'article';
    const html  = buildHTML();
    const blob  = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url   = URL.createObjectURL(blob);
    const a     = document.createElement('a');
    a.href      = url;
    a.download  = title.replace(/[^\w\u4e00-\u9fa5]/g, '_').substring(0, 40) + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('HTML 已下载 ✓');
}

function copyHTML() {
    navigator.clipboard.writeText(buildHTML()).then(() => {
        showToast('HTML 已复制到剪贴板 ✓');
    }).catch(() => showToast('复制失败，请使用 EXPORT 按钮'));
}

function resetAll() {
    if (!confirm('清空所有内容并重置？')) return;
    blocks = [];
    nextId = 0;
    ['f-title','f-subtitle','f-abstract','f-keywords',
     'f-prev-text','f-next-text'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-author').value     = 'TANG ZE ZHEN';
    document.getElementById('f-prev-url').value   = '#';
    document.getElementById('f-next-url').value   = '#';
    document.getElementById('f-footer-tag').value = 'END OF DOCUMENT / NODE_01_SUCCESS';
    addBlock('h2', '');
    addBlock('p',  '');
    updatePreview();
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
}

// ═══════════════════════════════════════════════
//  RESIZE HANDLE
// ═══════════════════════════════════════════════
function initResize() {
    const handle = document.getElementById('resizeHandle');
    const panel  = document.getElementById('inputPanel');
    let dragging = false;
    let startX, startW;

    handle.addEventListener('mousedown', e => {
        dragging = true;
        startX   = e.clientX;
        startW   = panel.offsetWidth;
        handle.classList.add('dragging');
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
    });

    document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const newW = Math.max(260, Math.min(600, startW + e.clientX - startX));
        panel.style.width = newW + 'px';
    });

    document.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        handle.classList.remove('dragging');
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
    });
}
