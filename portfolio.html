<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>作品集 — 唐择镇</title>
    <style>
        :root {
            --bg: #0a0b10;
            --surface: #111218;
            --border: #1e1e2e;
            --red: #ff3b30;
            --dim: #86868b;
            --white: #f5f5f7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            height: 100vh;
            height: 100svh;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Fira Code", monospace;
            overflow: hidden;
        }

        .top-bar {
            height: 48px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 10;
        }

        .top-left { display: flex; align-items: center; gap: 16px; }

        .back-btn {
            color: var(--red);
            text-decoration: none;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            padding-bottom: 1px;
            border-bottom: 1px solid var(--red);
        }

        .doc-label {
            color: var(--white);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .doc-label span { color: var(--dim); font-weight: 400; }

        .clock { font-size: 10px; color: var(--dim); letter-spacing: 1px; }

        .viewer {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--surface);
        }

        .viewer iframe {
            position: absolute;
            top: -56px;
            left: 0;
            width: 100%;
            height: calc(100% + 56px);
            border: none;
            display: block;
        }

        .viewer::before,
        .viewer::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 1px;
            background: var(--border);
            z-index: 5;
        }
        .viewer::before { left: 0; }
        .viewer::after  { right: 0; }

        .bottom-bar {
            height: 30px;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .bottom-bar span { font-size: 9px; letter-spacing: 1.5px; color: var(--dim); }
        .bottom-bar .tag { color: var(--red); }

        @media (max-width: 640px) {
            .doc-label span { display: none; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-left">
            <a href="3.html" class="back-btn">← RETURN</a>
            <div class="doc-label">PORTFOLIO <span>/ 唐择镇 作品集</span></div>
        </div>
        <div class="clock" id="clock">--:--:--</div>
    </div>

    <div class="viewer">
        <iframe
            src="https://www.kdocs.cn/l/cm8PBaYwXZo4"
            allowfullscreen
            loading="lazy"
            title="唐择镇 作品集"
        ></iframe>
    </div>

    <div class="bottom-bar">
        <span>DOC ACCESS GRANTED</span>
        <span class="tag">ID: TZ-2026</span>
    </div>

    <script>
        setInterval(() => {
            document.getElementById('clock').textContent =
                new Date().toLocaleTimeString('en-GB', { hour12: false });
        }, 1000);
    </script>

</body>
</html>
